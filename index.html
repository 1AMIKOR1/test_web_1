  "lesson-fastapi-7": {
    id: "lesson-fastapi-7",
    sectionId: "sec-fastapi-intro",
    title: "Pydantic и модели данных",
    blocks: [
      { type: "lead", html: "<p>Модель Pydantic описывает данные, которые ожидает API. По ней FastAPI проверяет тело запроса, показывает схему в документации и помогает избежать передачи лишних полей в ответе.</p>" },
      { type: "heading", text: "Модель запроса" },
      { type: "code", text: "from pydantic import BaseModel, Field\n\nclass ProductIn(BaseModel):\n    name: str\n    price: float = Field(gt=0)\n    description: str | None = Field(default=None, max_length=300)\n\n@app.post(\"/products\")\nasync def create_product(product: ProductIn):\n    return product" },
      { type: "text", html: "<p>Если <code>price</code> не положителен или обязательное поле отсутствует, FastAPI вернёт структурированный ответ об ошибке валидации. <code>Field</code> добавляет ограничения и метаданные поля; его импортируют из <code>pydantic</code>.</p>" },
      { type: "heading", text: "Безопасный ответ" },
      { type: "code", text: "class UserIn(BaseModel):\n    username: str\n    password: str\n\nclass UserOut(BaseModel):\n    username: str\n\n@app.post(\"/users\", response_model=UserOut)\nasync def create_user(user: UserIn):\n    return user" },
      { type: "note", tone: "warning", html: "<p><code>response_model</code> — важный защитный слой: он фильтрует поля ответа. Не возвращайте пароль, токен или другой секрет только потому, что он есть в объекте внутри приложения.</p>" },
      { type: "heading", text: "Вложенные модели и коллекции" },
      { type: "code", text: "class Address(BaseModel):\n    city: str\n    street: str\n\nclass CustomerIn(BaseModel):\n    name: str\n    address: Address\n    tags: list[str] = []\n\n@app.post(\"/customers\")\nasync def create_customer(customer: CustomerIn):\n    return customer" },
      { type: "text", html: "<p>Pydantic рекурсивно проверяет вложенные поля: <code>address</code> должен быть объектом с нужными строками, а <code>tags</code> — списком строк. Наличие модели не освобождает от решения доменных вопросов: например, допустимость города, уникальность клиента или права доступа проверяет бизнес-логика.</p>" },
      { type: "heading", text: "Создание, проверка и сериализация" },
      { type: "text", html: "<p>В Pydantic v2 модель можно создавать обычным вызовом класса, проверять произвольные данные через <code>model_validate()</code>, а получать словарь через <code>model_dump()</code>. FastAPI делает большую часть этой работы сам для параметров маршрута и моделей ответа, но эти методы полезны при интеграции с очередью, файлом или внешним API.</p>" },
      { type: "code", text: "raw = {\"name\": \"Книга\", \"price\": 350}\nproduct = ProductIn.model_validate(raw)\n\n# Данные для другого слоя приложения\npayload = product.model_dump(exclude_none=True)" },
      { type: "heading", text: "Разделяйте вход и выход" },
      { type: "text", html: "<p>Одна модель «на всё» часто приводит к утечке полей или неясному контракту. Для создания, обновления и выдачи ресурса обычно нужны разные схемы: вход может содержать пароль, обновление — необязательные поля, а выход — идентификатор, созданный сервером. Явные модели делают эту разницу видимой.</p>" },
      { type: "table", caption: "Роль схем", head: ["Схема", "Пример назначения"], rows: [["ProductCreate", "Что клиент может передать при создании"], ["ProductUpdate", "Какие поля разрешено менять"], ["ProductOut", "Что API возвращает наружу"], ["ProductInDB", "Внутреннее представление с техническими полями"]] },
      { type: "note", tone: "warning", html: "<p>Изменение модели — изменение API-контракта. Добавляйте обязательные поля и ужесточайте ограничения осознанно: это может сломать существующих клиентов.</p>" },
      { type: "heading", text: "Ограничения и удобные метаданные" },
      { type: "text", html: "<p>Модель может выражать больше, чем базовый тип. Через <code>Field</code> задают границы числа, длину строки, описание и пример; для специальных форматов доступны типы и валидаторы Pydantic. Эти правила одновременно защищают обработчик от очевидно неверных данных и становятся частью документации.</p><p>Ограничения должны соответствовать предметной области. Например, <code>gt=0</code> для цены означает «строго больше нуля», но не проверяет валюту, скидку или доступность товара. Не превращайте модель в единственное место бизнес-правил: правила, требующие базы данных или контекста пользователя, обычно живут в сервисном слое.</p>" },
      { type: "code", text: "class ArticleCreate(BaseModel):\n    title: str = Field(min_length=3, max_length=200)\n    body: str = Field(min_length=1)\n    published: bool = False\n\n# Ошибка валидации содержит путь до проблемного поля\n# и помогает клиенту показать сообщение пользователю." },
      { type: "heading", text: "Совместимость моделей" },
      { type: "text", html: "<p>Необязательное новое поле с разумным значением по умолчанию обычно менее рискованно для клиентов, чем новое обязательное поле. Удаление или переименование поля, смена его типа и изменение значения статуса могут быть breaking change. Для публичного API заранее определяют политику версий и срок поддержки старого контракта.</p><p>Разделение моделей помогает и при частичном обновлении. Схема <code>ArticleUpdate</code> может содержать все поля необязательными, но сервис должен отличать «поле не передано» от «передано пустое значение». Согласуйте это поведение с клиентами и закрепите тестами.</p>" },
      { type: "quiz", id: "q1", question: "Что делает response_model?", options: ["Запускает сервер", "Фильтрует и документирует структуру ответа", "Шифрует базу данных", "Заменяет обработчик"], correct: [1], multiple: false, explanation: "response_model описывает, проверяет и сериализует выходные данные." },
      { type: "truefalse", id: "tf1", title: "Модели и валидация", statements: [{ text: "Field импортируется из pydantic.", answer: true, explanation: "Ограничения модели задаёт Pydantic." }, { text: "Модель запроса можно использовать как тип параметра обработчика.", answer: true, explanation: "FastAPI распознаёт её как тело запроса." }, { text: "response_model должен включать все внутренние поля объекта.", answer: false, explanation: "Он должен содержать только поля публичного API-ответа." }] },
      { type: "flashcards", id: "fc1", title: "Pydantic", cards: [{ front: "BaseModel", back: "Базовый класс модели данных Pydantic." }, { front: "Field", back: "Ограничения и метаданные поля." }, { front: "Валидация", back: "Проверка данных по объявленной схеме." }, { front: "response_model", back: "Схема безопасного публичного ответа." }] }
    ]
  },

  "lesson-fastapi-8": {
    id: "lesson-fastapi-8",
    sectionId: "sec-fastapi-intro",
    title: "OpenAPI, Swagger UI и ReDoc",
    blocks: [
      { type: "lead", html: "<p>Документация API — часть его интерфейса. FastAPI собирает OpenAPI-схему из путей, HTTP-методов, аннотаций типов и Pydantic-моделей, поэтому документация развивается вместе с кодом.</p>" },
      { type: "heading", text: "Что доступно по умолчанию" },
      { type: "table", caption: "Стандартные адреса", head: ["Адрес", "Назначение"], rows: [["/docs", "Swagger UI: пробовать запросы в браузере"], ["/redoc", "ReDoc: читать структурированную документацию"], ["/openapi.json", "OpenAPI-схема в JSON для инструментов"]] },
      { type: "code", text: "from fastapi import FastAPI\n\napp = FastAPI(\n    title=\"Каталог книг\",\n    version=\"1.0.0\",\n    description=\"Небольшой учебный API\"\n)\n\n@app.get(\"/books/{book_id}\", tags=[\"books\"])\nasync def get_book(book_id: int):\n    return {\"id\": book_id, \"title\": \"FastAPI\"}" },
      { type: "text", html: "<p>Название, версия, описание и теги делают документацию понятнее. Описание параметров и моделей появляется автоматически, но для важных ошибок и нестандартных ответов стоит явно указывать коды и схемы.</p>" },
      { type: "note", tone: "tip", html: "<p>В разработке открывайте <code>/docs</code> после добавления маршрута. Это быстрый способ проверить путь, ожидаемые параметры и форму ответа ещё до подключения фронтенда.</p>" },
      { type: "heading", text: "Из чего строится OpenAPI" },
      { type: "text", html: "<p>Для каждой path operation FastAPI видит метод и путь, параметры, Pydantic-модели, тип ответа, теги, статусы и дополнительное описание. Эти сведения объединяются в одну схему. Swagger UI и ReDoc — два разных интерфейса, которые читают эту же схему; сторонняя программа может получить её по адресу <code>/openapi.json</code>.</p>" },
      { type: "heading", text: "Документируйте возможные ответы" },
      { type: "code", text: "from fastapi import HTTPException\n\n@app.get(\n    \"/books/{book_id}\",\n    response_model=BookOut,\n    responses={404: {\"description\": \"Книга не найдена\"}},\n)\nasync def get_book(book_id: int):\n    book = await books.get(book_id)\n    if book is None:\n        raise HTTPException(status_code=404, detail=\"Книга не найдена\")\n    return book" },
      { type: "text", html: "<p>Описание ошибок важно для потребителей API не меньше схемы успешного ответа. Если клиент должен обрабатывать 401, 403, 404 или 409, это должно быть частью контракта. Статусы нужно выбирать по смыслу, а не возвращать <code>200</code> для любой ситуации.</p>" },
      { type: "heading", text: "Кастомизация без потери смысла" },
      { type: "list", ordered: false, items: ["Задавайте title, version, description и contact-информацию приложения.", "Группируйте операции тегами, например users, orders или admin.", "Пишите summary и description для неоднозначных операций.", "При необходимости изменяйте пути docs, redoc и openapi_url или отключайте публичную схему согласно требованиям окружения.", "Проверяйте документацию после изменения моделей и маршрутов."] },
      { type: "note", tone: "warning", html: "<p>Интерактивная документация в production не должна случайно раскрывать служебные возможности. Решение об открытости <code>/docs</code> и <code>/openapi.json</code> принимают с учётом аудитории API и политики безопасности.</p>" },
      { type: "heading", text: "Документация как договорённость" },
      { type: "text", html: "<p>OpenAPI полезна не только как страница для человека. На её основе можно проверять контракт, генерировать типизированный клиент и сравнивать версии API в CI. Для этого схема должна быть стабильной и осмысленной: правильные названия операций, точные модели, форматы дат и денег, коды ответов и описание авторизации.</p><p>Хорошая документация отвечает на вопросы клиента до первого запроса: как получить доступ, какую версию отправить, какие поля обязательны, что означает пустой список, можно ли повторить запрос, как выглядит ошибка и есть ли ограничение частоты. Автоматически сгенерированная форма показывает структуру, а эти правила часто нужно дописать в description, внешнем руководстве или соглашении команды.</p>" },
      { type: "heading", text: "Проверка перед публикацией" },
      { type: "list", ordered: false, items: ["Открыть /docs и попробовать успешный, неверный и отсутствующий ресурс.", "Сверить примеры ответов с фактическим JSON, особенно после изменения response_model.", "Проверить, что секретные или внутренние маршруты не включены в публичную схему без решения команды.", "Сравнить OpenAPI JSON с предыдущей версией при потенциально ломающем изменении.", "Убедиться, что title, version и теги помогают потребителю ориентироваться."] },
      { type: "quiz", id: "q1", question: "По какому адресу обычно доступна Swagger UI?", options: ["/swagger", "/docs", "/api", "/schema"], correct: [1], multiple: false, explanation: "FastAPI по умолчанию размещает Swagger UI по адресу /docs." },
      { type: "codefill", id: "cf1", title: "Маршрут в документации", code: "@app.get(\"/books/{book_id}\", ___=[\"books\"])\nasync def get_book(book_id: int):\n    return {\"id\": book_id}", options: ["tags", "models", "docs"], correct: [0], explanation: "tags группируют операции в документации." },
      { type: "memory", id: "mem1", title: "Адрес — назначение", pairs: [{ a: "/docs", b: "Swagger UI" }, { a: "/redoc", b: "ReDoc" }, { a: "/openapi.json", b: "Схема OpenAPI" }, { a: "tags", b: "Группы операций" }] }
    ]
  },

  "lesson-fastapi-9": {
    id: "lesson-fastapi-9",
    sectionId: "sec-fastapi-intro",
    title: "Сообщество и ресурсы",
    blocks: [
      { type: "lead", html: "<p>Умение пользоваться источниками важнее запоминания всех аргументов FastAPI. Начинайте с официальной документации, а обсуждения и примеры из сообщества используйте как дополнение, которое нужно проверять.</p>" },
      { type: "heading", text: "Надёжная последовательность поиска" },
      { type: "list", ordered: true, items: ["Найдите нужную тему в официальном руководстве FastAPI.", "Проверьте версию Python и используемых библиотек.", "Соберите минимальный пример, воспроизводящий задачу.", "Только затем ищите обсуждения, статьи и готовые шаблоны."] },
      { type: "text", html: "<p>Официальные материалы включают руководство, справочник и репозиторий проекта. GitHub Issues и Discussions полезны для контекста, но не каждое старое решение остаётся актуальным. Особенно внимательно проверяйте примеры, написанные для прежних версий Pydantic.</p>" },
      { type: "code", text: "# Минимальный пример для вопроса или ошибки\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"/ping\")\ndef ping():\n    return {\"ok\": True}" },
      { type: "note", tone: "warning", html: "<p>Не публикуйте в вопросах токены, пароли, персональные данные и конфигурации production-сервисов. Уменьшайте пример до минимального безопасного воспроизведения проблемы.</p>" },
      { type: "heading", text: "Как оценивать найденный пример" },
      { type: "list", ordered: true, items: ["Проверьте дату и версии Python, FastAPI и Pydantic.", "Сравните подход с официальным руководством и справочником.", "Запустите пример в отдельном минимальном проекте, а не сразу в рабочем сервисе.", "Поймите, какие зависимости, настройки и ограничения автор не показал.", "Перенесите только нужную идею, дополнив её тестом и обработкой ошибок."] },
      { type: "text", html: "<p>Материалы сообщества полезны для реальных кейсов, но их качество и актуальность различаются. Особенно осторожно относитесь к коду, который отключает проверку сертификатов, вставляет секреты в исходники, ловит все исключения или использует устаревшие API. Хороший ответ объясняет не только «что вставить», но и почему решение подходит.</p>" },
      { type: "heading", text: "Участие в open source" },
      { type: "text", html: "<p>Помочь проекту можно не только кодом: воспроизвести ошибку, улучшить документацию, перевести текст, ответить на вопрос с подтверждённым примером. Перед созданием issue полезно поискать существующие обсуждения и подготовить минимальное воспроизведение: версии, ожидаемое и фактическое поведение, короткий код без секретов.</p>" },
      { type: "code", text: "# Полезный минимум для сообщения об ошибке\n# Python: 3.x\n# FastAPI: x.y.z\n# Pydantic: x.y.z\n# Команда запуска: uv run fastapi dev\n# Ожидалось: ...\n# Получилось: ...\n# Минимальный main.py: ..." },
      { type: "heading", text: "Ресурсы по назначению" },
      { type: "table", caption: "Где искать информацию", head: ["Источник", "Когда использовать"], rows: [["Официальное руководство", "Изучение поддерживаемого способа работы"], ["Справочник API", "Точные параметры и типы"], ["GitHub Issues/Discussions", "Контекст известной проблемы или решения"], ["Блоги и курсы", "Объяснения и учебные проекты"], ["Stack Overflow", "Конкретные повторяемые вопросы"]] },
      { type: "note", tone: "tip", html: "<p>Сохраняйте ссылки на первоисточники рядом с важными техническими решениями проекта. Через несколько месяцев это поможет отличить осознанное ограничение от случайного копирования кода.</p>" },
      { type: "heading", text: "Учитесь через небольшие проекты" },
      { type: "text", html: "<p>Самый надёжный способ закрепить документацию — небольшая законченная задача. Например: каталог книг с CRUD-операциями, заметки с пользователями или сервис задач. В таком проекте естественно встретятся модели запроса и ответа, пути и query-параметры, 404, тест, хранение и документация. Делайте шаги короткими: сначала один маршрут и тест, затем модель, затем хранилище и авторизация.</p><p>Готовые boilerplate-репозитории удобно изучать, но они часто содержат больше инфраструктуры, чем нужно новичку: контейнеры, очереди, несколько баз и сложную систему настроек. Не копируйте шаблон целиком, пока не понимаете, для какой задачи существует каждый компонент. Минимальное работающее приложение проще отладить, защитить и развивать.</p>" },
      { type: "heading", text: "Доброжелательное техническое общение" },
      { type: "text", html: "<p>Когда спрашиваете помощи, сформулируйте цель, покажите минимальный код, версии и сообщение об ошибке, а также перечислите попытки решения. Когда отвечаете, поясняйте предположения и ограничения, не публикуйте чужие данные и не советуйте отключать проверку безопасности ради «быстрого исправления». Такая дисциплина делает сообщество полезнее, а собственные заметки — понятнее через год.</p>" },
      { type: "quiz", id: "q1", question: "Где лучше сначала проверить актуальный способ использования FastAPI?", options: ["В случайном старом сниппете", "В официальной документации", "Только в комментариях к видео", "В имени файла проекта"], correct: [1], multiple: false, explanation: "Официальная документация — первичный источник по актуальному API фреймворка." },
      { type: "truefalse", id: "tf1", title: "Работа с ресурсами", statements: [{ text: "Минимальный пример помогает другим воспроизвести проблему.", answer: true, explanation: "Он убирает лишнее и делает вопрос проверяемым." }, { text: "Секреты можно добавить в публичный issue для полноты контекста.", answer: false, explanation: "Секреты нельзя публиковать." }, { text: "Старый пример Pydantic стоит проверять по текущей документации.", answer: true, explanation: "API библиотек развивается." }] },
      { type: "flashcards", id: "fc1", title: "Полезные привычки", cards: [{ front: "Первичный источник", back: "Официальная документация или репозиторий проекта." }, { front: "Минимальный пример", back: "Небольшой код, воспроизводящий задачу." }, { front: "Issue", back: "Обсуждение ошибки или предложения в репозитории." }, { front: "Версия", back: "Важный контекст для совместимости примера." }] }
    ]
  },

  "lesson-fastapi-10": {
    id: "lesson-fastapi-10",
    sectionId: "sec-fastapi-intro",
    title: "Перспективы развития",
    blocks: [
      { type: "lead", html: "<p>FastAPI развивается вместе с Python, Pydantic и стандартами API. Но полезнее думать не о модных словах, а о навыках, которые сохраняют ценность: ясный контракт, проверка данных, наблюдаемость и безопасное развитие сервиса.</p>" },
      { type: "heading", text: "Что развивать после введения" },
      { type: "list", ordered: false, items: ["Проектирование ресурсов, статусов HTTP и версий API.", "Аутентификация, авторизация и безопасная работа с секретами.", "Тесты маршрутов и зависимостей.", "Подключение баз данных, миграций и очередей задач.", "Логирование, метрики и развёртывание приложения."] },
      { type: "code", text: "from fastapi import HTTPException\n\nbooks = {1: {\"title\": \"FastAPI\"}}\n\n@app.get(\"/books/{book_id}\")\nasync def get_book(book_id: int):\n    book = books.get(book_id)\n    if book is None:\n        raise HTTPException(status_code=404, detail=\"Книга не найдена\")\n    return book" },
      { type: "text", html: "<p>Этот маленький маршрут уже демонстрирует долговечный подход: типизированный вход, явный статус ошибки и JSON-ответ. Следующий шаг — не добавлять всё сразу, а покрыть поведение тестами и постепенно выделять модули.</p>" },
      { type: "note", tone: "tip", html: "<p>Технология меняется, а хорошо определённый API-контракт и автоматические проверки остаются основой поддерживаемого сервиса. Документация, тесты и мониторинг стоит планировать вместе с маршрутами.</p>" },
      { type: "heading", text: "Практики, которые переживают обновления" },
      { type: "text", html: "<p>Версии библиотек и способы развёртывания меняются, но несколько принципов остаются полезными. API должен иметь ясные модели входа и выхода, ошибки должны быть предсказуемы, а изменения — покрыты тестами. Логи, метрики и трассировка помогают увидеть поведение сервиса после выпуска, когда одного кода уже недостаточно.</p>" },
      { type: "heading", text: "Дальнейший маршрут обучения" },
      { type: "list", ordered: true, items: ["Спроектировать небольшой CRUD API и его модели.", "Добавить тесты маршрутов, ошибок и зависимостей.", "Освоить аутентификацию и авторизацию на подходящем для продукта уровне.", "Подключить хранилище данных и научиться выполнять миграции безопасно.", "Настроить конфигурацию, логирование, мониторинг и развёртывание."] },
      { type: "heading", text: "Развитие не означает добавлять всё" },
      { type: "text", html: "<p>WebSocket, потоковые ответы, фоновые задачи, OAuth2 и интеграция с AI-сервисами могут быть полезны, но только если это следует из требований. Преждевременно выбранная инфраструктура усложняет тесты и поддержку. Начинайте с простого измеримого сценария, затем улучшайте узкое место, которое действительно обнаружили.</p>" },
      { type: "code", text: "from fastapi.testclient import TestClient\n\nclient = TestClient(app)\n\ndef test_book_not_found():\n    response = client.get(\"/books/999\")\n    assert response.status_code == 404\n    assert response.json()[\"detail\"] == \"Книга не найдена\"" },
      { type: "text", html: "<p>Этот тест закрепляет контракт ошибки. Когда внутреннее устройство хранилища изменится, тест продолжит защищать поведение, важное для клиента. По тому же принципу тестируют валидацию, авторизацию и успешные ответы.</p>" },
      { type: "note", tone: "warning", html: "<p>Не обещайте клиентам то, что не готовы поддерживать. Изменение поля, статуса или смысла endpoint — публичное изменение; планируйте совместимость, документируйте версии и давайте потребителям время на переход.</p>" },
      { type: "heading", text: "Как следить за изменениями" },
      { type: "text", html: "<p>Зависимости обновляют регулярно, но контролируемо: читают release notes, проверяют требования совместимости, обновляют в отдельной ветке и запускают тесты. Это безопаснее, чем годами не менять версии или сразу принимать крупное обновление в production. Фиксация версий и воспроизводимое окружение помогают понять, какая именно комбинация библиотек была проверена.</p><p>Новые возможности FastAPI, Python и экосистемы стоит оценивать через потребность продукта. Поддержка современных стандартов, улучшения типизации или более удобные инструменты могут уменьшить затраты на поддержку, но добавление новой зависимости также создаёт риск и долг. Полезная привычка — сформулировать проблему, критерий успеха и способ измерить результат до внедрения.</p>" },
      { type: "heading", text: "Чек-лист зрелого endpoint" },
      { type: "list", ordered: false, items: ["Маршрут имеет понятные метод, путь, модель входа и модель выхода.", "Ошибки используют подходящие HTTP-статусы и не раскрывают внутренние секреты.", "Права доступа и правила предметной области проверяются явно.", "Есть тесты как минимум для успешного и ошибочного сценария.", "Документация отражает фактическое поведение, а логи и метрики позволяют его наблюдать."] },
      { type: "text", html: "<p>На этом введение заканчивается, но цикл работы с API только начинается: спроектировать, реализовать, проверить, наблюдать, получить обратную связь и улучшить. FastAPI облегчает многие этапы этого цикла, когда типы и модели используются последовательно. Он не принимает архитектурные решения за команду, зато делает их видимыми в коде и контракте.</p>" },
      { type: "quiz", id: "q1", question: "Какой следующий шаг наиболее полезен после создания первого маршрута?", options: ["Сразу переписать всё на микросервисы", "Описать контракт и проверить его тестом", "Удалить типы из кода", "Отключить документацию"], correct: [1], multiple: false, explanation: "Ясный контракт и тесты помогают безопасно развивать API." },
      { type: "codefill", id: "cf1", title: "Ответ «не найдено»", code: "raise HTTPException(status_code=___, detail=\"Книга не найдена\")", options: ["404", "200", "201"], correct: [0], explanation: "404 означает, что запрошенный ресурс не найден." },
      { type: "memory", id: "mem1", title: "Направление — цель", pairs: [{ a: "Тесты", b: "Проверка поведения API" }, { a: "Логирование", b: "Диагностика работы сервиса" }, { a: "Мониторинг", b: "Наблюдение за состоянием в эксплуатации" }, { a: "Миграции", b: "Управление изменениями схемы БД" }] }
    ]
  },

  "lesson-fastapi-setup-1": {
    id: "lesson-fastapi-setup-1",
    sectionId: "sec-fastapi-setup",
    title: "Установка FastAPI",
    blocks: [
      { type: "lead", html: "<p>Начнём с воспроизводимой среды: отдельного проекта, виртуального окружения и минимального приложения. Так зависимости FastAPI не смешиваются с другими проектами, а первый запуск можно повторить на другом компьютере.</p>" },
      { type: "heading", text: "Что понадобится" },
      { type: "text", html: "<p>Перед установкой проверьте, что Python запускается из терминала. Точная поддержка версий зависит от выбранного релиза FastAPI; примеры этого раздела рассчитаны на Python 3.10+. Основной маршрут раздела — менеджер окружения и зависимостей <code>uv</code>, который рекомендует актуальная документация FastAPI.</p>" },
      { type: "list", ordered: false, items: ["Проверить Python: python --version или python3 --version.", "Создать отдельный каталог проекта.", "Добавить FastAPI в окружение проекта через uv.", "Зафиксировать способ установки и проверять запуск небольшим примером."] },
      { type: "heading", text: "Вариант с uv" },
      { type: "code", lang: "bash", text: "uv init fastapi-demo --bare\ncd fastapi-demo\nuv add \"fastapi[standard]\"" },
      { type: "text", html: "<p>Группа <code>standard</code> добавляет к FastAPI удобные компоненты для обычного старта, включая команду <code>fastapi</code> и Uvicorn. Квадратные скобки в команде — часть имени extra-группы, поэтому всё имя принято заключать в кавычки.</p>" },
      { type: "heading", text: "Что делает uv" },
      { type: "text", html: "<p><code>uv</code> создаёт и использует виртуальное окружение проекта автоматически. Команда <code>uv run</code> запускает программу внутри этого окружения, поэтому вручную активировать <code>.venv</code> для учебного сценария не требуется.</p>" },
      { type: "code", lang: "bash", text: "uv sync\nuv run python --version" },
      { type: "note", tone: "tip", html: "<p>Файл <code>pyproject.toml</code> описывает зависимости проекта, а <code>uv.lock</code> помогает воспроизводить их версии. Не добавляйте сгенерированное окружение <code>.venv</code> в Git.</p>" },
      { type: "heading", text: "Проверяем установку первым приложением" },
      { type: "code", lang: "python", text: "# main.py\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"/\")\nasync def root():\n    return {\"message\": \"Привет, FastAPI!\"}" },
      { type: "text", html: "<p>В проекте с <code>uv</code> запустите приложение командой <code>uv run fastapi dev</code>. Если нужно явно запустить сервер Uvicorn из того же окружения, используйте <code>uv run uvicorn main:app --reload</code>. Флаг <code>--reload</code> предназначен для разработки: сервер перезапускается после изменений файлов.</p>" },
      { type: "list", ordered: false, items: ["Откройте http://127.0.0.1:8000/ и проверьте JSON-ответ.", "Откройте /docs для Swagger UI.", "Откройте /redoc для альтернативного интерфейса документации.", "Остановите сервер сочетанием Ctrl+C."] },
      { type: "note", tone: "warning", html: "<p>Установка прошла успешно только тогда, когда команда запускается в том же окружении, куда установлен FastAPI. Если импорт не найден, сначала проверьте активный интерпретатор и список пакетов.</p>" },
      { type: "quiz", id: "q1", question: "Какой вариант устанавливает FastAPI вместе со стандартными компонентами для запуска?", options: ["uv add fastapi", "uv add \"fastapi[standard]\"", "python -m venv fastapi", "uv run fastapi install"], correct: [1], multiple: false, explanation: "Группа standard добавляет рекомендуемые для обычного старта компоненты, а uv записывает зависимость в проект." },
      { type: "codefill", id: "cf1", title: "Добавь зависимость", code: "uv ___ \"fastapi[standard]\"", options: ["add", "run", "init"], correct: [0], explanation: "Команда uv add добавляет пакет в зависимости проекта." },
      { type: "flashcards", id: "fc1", title: "Термины установки", cards: [{ front: "Виртуальное окружение", back: "Изолированное место для интерпретатора и зависимостей проекта." }, { front: "fastapi[standard]", back: "FastAPI с набором стандартных дополнительных компонентов." }, { front: "fastapi dev", back: "Команда запуска FastAPI в режиме разработки." }, { front: "127.0.0.1:8000", back: "Обычный локальный адрес первого dev-сервера." }] }
    ]
  },

  "lesson-fastapi-setup-2": {
    id: "lesson-fastapi-setup-2",
    sectionId: "sec-fastapi-setup",
    title: "Установка и запуск Uvicorn",
    blocks: [
      { type: "lead", html: "<p>FastAPI описывает приложение, но сам по себе не открывает сетевой порт. Для запуска нужен ASGI-сервер. Uvicorn принимает HTTP-соединения и передаёт их ASGI-приложению FastAPI.</p>" },
      { type: "heading", text: "FastAPI и Uvicorn — разные роли" },
      { type: "table", caption: "Кто за что отвечает", head: ["Компонент", "Роль"], rows: [["FastAPI", "Маршруты, параметры, обработчики и схема API"], ["ASGI", "Стандарт взаимодействия сервера и Python-приложения"], ["Uvicorn", "Запуск ASGI-приложения и работа с сетевыми соединениями"]] },
      { type: "text", html: "<p>При установке <code>fastapi[standard]</code> Uvicorn уже входит в стандартный набор. Если сервер нужно объявить отдельной зависимостью, добавьте его в проект через <code>uv</code>:</p>" },
      { type: "code", lang: "bash", text: "uv add \"uvicorn[standard]\"" },
      { type: "heading", text: "Точка входа: module:object" },
      { type: "code", lang: "bash", text: "uv run uvicorn main:app --reload" },
      { type: "list", ordered: false, items: ["main — имя модуля main.py без расширения.", "app — имя объекта FastAPI внутри этого модуля.", "--reload — перезапуск при изменениях, удобный только в разработке."] },
      { type: "text", html: "<p>Если приложение лежит в пакете, точка входа отражает путь импорта, например <code>backend.main:app</code>. Ошибка в любой части записи приводит к сообщению о невозможности импортировать приложение.</p>" },
      { type: "heading", text: "Адрес и порт" },
      { type: "code", lang: "bash", text: "uv run uvicorn main:app --host 127.0.0.1 --port 8080" },
      { type: "text", html: "<p>Параметр <code>--host</code> выбирает сетевой интерфейс, а <code>--port</code> — порт. Адрес <code>127.0.0.1</code> ограничивает доступ локальным компьютером. Значение <code>0.0.0.0</code> может открыть сервер другим сетям, поэтому его используют осознанно и с учётом настроек firewall и reverse proxy.</p>" },
      { type: "heading", text: "Перезагрузка и рабочие процессы" },
      { type: "text", html: "<p>В режиме разработки нужен быстрый цикл «изменил код — проверил результат», поэтому применяют <code>--reload</code>. Для запуска нескольких процессов используют <code>--workers</code>, например <code>uv run uvicorn main:app --workers 2</code>. Эти параметры нельзя сочетать: Uvicorn считает <code>--reload</code> и <code>--workers</code> взаимоисключающими.</p>" },
      { type: "note", tone: "warning", html: "<p>Команда с <code>--reload</code> не является production-конфигурацией. В развёрнутой среде отдельно проектируют число процессов, прокси, TLS, тайм-ауты, логи и мониторинг.</p>" },
      { type: "quiz", id: "q1", question: "Что означает запись main:app в команде Uvicorn?", options: ["Порт 8000 и хост app", "Модуль main.py и объект приложения app", "Файл app.py и функцию main", "Две переменные окружения"], correct: [1], multiple: false, explanation: "Uvicorn импортирует объект app из модуля main, то есть из файла main.py." },
      { type: "truefalse", id: "tf1", title: "Проверь запуск", statements: [{ text: "FastAPI и Uvicorn выполняют одну и ту же роль.", answer: false, explanation: "FastAPI создаёт приложение и маршруты, а Uvicorn запускает ASGI-приложение как сервер." }, { text: "--reload удобен для локальной разработки.", answer: true, explanation: "Он перезапускает сервер после изменений исходных файлов." }, { text: "--reload и --workers можно всегда указывать вместе.", answer: false, explanation: "В Uvicorn эти параметры взаимоисключающие." }] },
      { type: "codefill", id: "cf1", title: "Автоматическая перезагрузка", code: "uvicorn main:app --___", options: ["reload", "workers", "host"], correct: [0], explanation: "Флаг reload включает отслеживание изменений и перезапуск dev-сервера." },
      { type: "memory", id: "mem1", title: "Параметр — назначение", pairs: [{ a: "main:app", b: "Модуль и объект приложения" }, { a: "--host", b: "Сетевой интерфейс" }, { a: "--port", b: "Номер порта" }, { a: "--workers", b: "Количество процессов" }] }
    ]
  },

  "lesson-fastapi-setup-3": {
    id: "lesson-fastapi-setup-3",
    sectionId: "sec-fastapi-setup",
    title: "Основные настройки FastAPI",
    blocks: [
      { type: "lead", html: "<p>Экземпляр <code>FastAPI</code> хранит настройки приложения: название и версию API, адреса документации, описание схемы и дополнительные middleware. Начинайте с небольшого набора параметров, которые действительно нужны клиентам и команде.</p>" },
      { type: "heading", text: "Метаданные и документация" },
      { type: "code", lang: "python", text: "from fastapi import FastAPI\n\napp = FastAPI(\n    title=\"Каталог книг\",\n    description=\"Учебный API каталога\",\n    version=\"1.0.0\",\n    docs_url=\"/docs\",\n    redoc_url=\"/redoc\",\n    openapi_url=\"/openapi.json\",\n)" },
      { type: "list", ordered: false, items: ["title, description и version объясняют назначение API.", "docs_url задаёт путь Swagger UI; redoc_url — путь ReDoc.", "openapi_url задаёт путь JSON-схемы OpenAPI.", "Значение None у соответствующего URL отключает этот endpoint документации."] },
      { type: "text", html: "<p>FastAPI строит OpenAPI-схему из маршрутов, параметров, аннотаций типов и моделей. Поэтому после изменения контракта проверяйте не только страницу <code>/docs</code>, но и фактические ответы приложения.</p>" },
      { type: "heading", text: "CORS: разрешайте нужные источники" },
      { type: "code", lang: "python", text: "from fastapi.middleware.cors import CORSMiddleware\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\"https://client.example\"],\n    allow_credentials=True,\n    allow_methods=[\"GET\", \"POST\"],\n    allow_headers=[\"Authorization\", \"Content-Type\"],\n)" },
      { type: "text", html: "<p>CORS нужен браузеру, когда клиент и API находятся на разных origins. В рабочем приложении перечисляйте известные origins и минимально необходимые методы и заголовки. Универсальная звёздочка <code>*</code> удобна для чернового эксперимента, но не должна заменять политику доступа; при credentials ограничения становятся особенно важны.</p>" },
      { type: "heading", text: "Группируйте маршруты через APIRouter" },
      { type: "code", lang: "python", text: "from fastapi import APIRouter, FastAPI\n\napp = FastAPI()\nrouter = APIRouter(prefix=\"/items\", tags=[\"items\"])\n\n@router.get(\"/\")\nasync def list_items():\n    return [{\"id\": 1}]\n\napp.include_router(router)" },
      { type: "text", html: "<p><code>prefix</code> добавляется ко всем маршрутам роутера, а <code>tags</code> группируют операции в документации. Так транспортный слой можно разделять по предметным областям, не превращая <code>main.py</code> в один длинный файл.</p>" },
      { type: "heading", text: "Ресурсы жизненного цикла" },
      { type: "code", lang: "python", text: "from contextlib import asynccontextmanager\nfrom fastapi import FastAPI\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    # Подготовить общий ресурс до первого запроса\n    yield\n    # Освободить ресурс при завершении приложения\n\napp = FastAPI(lifespan=lifespan)" },
      { type: "note", tone: "info", html: "<p>Для новых приложений используйте параметр <code>lifespan</code> для логики запуска и остановки. Старый подход с <code>@app.on_event(\"startup\")</code> и <code>shutdown</code> помечен в актуальной документации как устаревший.</p>" },
      { type: "heading", text: "Настраивайте по окружению" },
      { type: "text", html: "<p>Адреса документации, origins CORS и режим отладки могут различаться в development и production. Секреты и строки подключения не встраивайте в исходный код: для конфигурации используйте переменные окружения и отдельный слой настроек. Подробная работа с ними будет следующим шагом после базовой настройки приложения.</p>" },
      { type: "quiz", id: "q1", question: "Зачем нужен openapi_url в настройках FastAPI?", options: ["Чтобы выбрать порт Uvicorn", "Чтобы задать путь к JSON-схеме OpenAPI", "Чтобы подключить базу данных", "Чтобы активировать CORS"], correct: [1], multiple: false, explanation: "openapi_url задаёт путь, по которому FastAPI отдаёт автоматически созданную OpenAPI-схему." },
      { type: "truefalse", id: "tf1", title: "Настройки приложения", statements: [{ text: "APIRouter помогает группировать связанные маршруты.", answer: true, explanation: "Роутер объединяет маршруты и позволяет подключить их к приложению с общим prefix или tags." }, { text: "CORS заменяет аутентификацию пользователей.", answer: false, explanation: "CORS управляет браузерными cross-origin запросами, но не устанавливает личность и права пользователя." }, { text: "Для новых приложений рекомендуется lifespan вместо on_event.", answer: true, explanation: "Актуальная документация FastAPI помечает on_event как устаревший подход." }] },
      { type: "codefill", id: "cf1", title: "Путь документации", code: "app = FastAPI(docs_url=___)", options: ["\"/docs\"", "\"/openapi.json\"", "None"], correct: [0], explanation: "Значение /docs — стандартный путь к интерфейсу Swagger UI." },
      { type: "flashcards", id: "fc1", title: "Параметры FastAPI", cards: [{ front: "title", back: "Название API в метаданных и документации." }, { front: "openapi_url", back: "Путь к автоматически созданной OpenAPI-схеме." }, { front: "APIRouter", back: "Группа маршрутов с общими настройками." }, { front: "lifespan", back: "Контекст жизненного цикла приложения." }] }
    ]
  },

  "lesson-fastapi-setup-4": {
    id: "lesson-fastapi-setup-4",
    sectionId: "sec-fastapi-setup",
    title: "Настройка IDE для разработки",
    blocks: [
      { type: "lead", html: "<p>Хорошо настроенная IDE сокращает время между идеей, запуском и исправлением ошибки. Для FastAPI особенно важны правильный интерпретатор, автодополнение типов, быстрый запуск сервера и аккуратная работа с файлами проекта.</p>" },
      { type: "heading", text: "Минимальный набор инструментов" },
      { type: "list", ordered: false, items: ["Редактор с поддержкой Python и виртуальных окружений.", "Расширение Python и анализатор Pylance в VS Code или аналогичные средства в другой IDE.", "Терминал для запуска FastAPI и проверки команд вне графических кнопок.", "Git и файл .gitignore для исключения окружения и секретов.", "Средства запуска тестов и HTTP-запросов — по мере появления тестов и endpoint."] },
      { type: "heading", text: "VS Code: выберите правильный интерпретатор" },
      { type: "text", html: "<p>После создания <code>.venv</code> откройте каталог проекта в VS Code и выберите этот интерпретатор через команду <code>Python: Select Interpreter</code>. Открытый терминал должен использовать то же окружение. Быстрая проверка показывает путь к реально запущенному Python:</p>" },
      { type: "code", lang: "bash", text: "uv run python -c \"import sys; print(sys.executable)\"\nuv run fastapi --help" },
      { type: "note", tone: "warning", html: "<p>Если IDE подсвечивает импорт красным, а терминал запускает приложение, чаще всего выбраны разные интерпретаторы. Сверьте путь Python в IDE и результат <code>sys.executable</code>, затем переоткройте терминал.</p>" },
      { type: "heading", text: "Автодополнение и проверка типов" },
      { type: "code", lang: "json", text: "// .vscode/settings.json\n{\n  \"python.analysis.typeCheckingMode\": \"basic\"\n}" },
      { type: "text", html: "<p>Автодополнение помогает увидеть параметры FastAPI, а проверка типов ловит часть ошибок до запуска. Это подсказки, а не замена тестам: код нужно запускать и проверять реальными HTTP-запросами.</p>" },
      { type: "heading", text: "Запускайте приложение из терминала" },
      { type: "code", lang: "bash", text: "uv run fastapi dev\n# или с явным вызовом Uvicorn:\nuv run uvicorn main:app --reload" },
      { type: "text", html: "<p>Запуск из терминала полезен даже при наличии кнопки Run: команда остаётся явной и легко переносится в README, CI или конфигурацию запуска. Когда проект разрастётся, можно добавить отдельную конфигурацию отладки IDE, но точка входа всё равно должна быть понятна: <code>main:app</code>.</p>" },
      { type: "heading", text: "Не отправляйте лишнее в Git" },
      { type: "code", lang: "text", text: ".venv/\n__pycache__/\n*.py[cod]\n.env" },
      { type: "text", html: "<p>Виртуальное окружение и кэш Python можно создать заново. Файл <code>.env</code> часто содержит секреты, поэтому добавьте его в <code>.gitignore</code> и храните в репозитории только безопасный пример вроде <code>.env.example</code> без настоящих ключей.</p>" },
      { type: "heading", text: "Проверка рабочего места" },
      { type: "list", ordered: true, items: ["Открыть проект в IDE и убедиться, что выбран .venv.", "Проверить импорт FastAPI командой Python.", "Запустить dev-сервер и открыть /docs.", "Изменить ответ корневого маршрута и убедиться, что --reload сработал.", "Проверить, что .venv и .env не попадают в git status."] },
      { type: "quiz", id: "q1", question: "Что нужно проверить первым, если IDE не находит установленный FastAPI?", options: ["Размер шрифта", "Выбранный интерпретатор Python", "Название браузера", "Цвет темы"], correct: [1], multiple: false, explanation: "IDE и терминал должны использовать то же окружение, в которое установлен FastAPI." },
      { type: "truefalse", id: "tf1", title: "Рабочая среда", statements: [{ text: "Pylance и аналогичные анализаторы могут помогать с автодополнением и типами.", answer: true, explanation: "Анализатор использует код и аннотации типов, чтобы показывать подсказки и предупреждения." }, { text: "Файл .env с настоящим токеном нужно обязательно закоммитить.", answer: false, explanation: "Секреты нельзя публиковать в репозитории; используйте переменные окружения и безопасное хранилище." }, { text: "Команда uv run запускает программу в окружении проекта.", answer: true, explanation: "uv run использует зависимости и интерпретатор, связанные с текущим проектом." }] },
      { type: "codefill", id: "cf1", title: "Команда uv", code: "uv ___ \"fastapi[standard]\"", options: ["add", "run", "sync"], correct: [0], explanation: "Команда uv add добавляет пакет в зависимости проекта и синхронизирует окружение." },
      { type: "memory", id: "mem1", title: "Инструмент — задача", pairs: [{ a: "Select Interpreter", b: "Выбор Python для проекта" }, { a: "Pylance", b: "Анализ и автодополнение" }, { a: ".gitignore", b: "Исключение файлов из Git" }, { a: "--reload", b: "Перезапуск dev-сервера" }] }
    ]
  },

  "lesson-fastapi-setup-5": {
    id: "lesson-fastapi-setup-5",
    sectionId: "sec-fastapi-setup",
    title: "Структура проекта по бизнес-сущностям",
    blocks: [
      {
        type: "lead",
        html: "<p>Когда FastAPI-проект растёт, один файл с маршрутами и одна папка для всех моделей быстро становятся тесными. В этом уроке соберём гибридную структуру: бизнес-сущности лежат в собственных пакетах, а общая инфраструктура, репозитории, сервисы и тесты организованы последовательно. Для доступа к БД используем асинхронный контекстный менеджер.</p>"
      },

      {
        type: "heading",
        text: "Цели урока"
      },

      {
        type: "list",
        ordered: true,
        items: [
          "Различать организацию по техническим слоям и организацию по бизнес-сущностям.",
          "Собрать структуру, в которой изменения сущности локализованы в одном пакете.",
          "Понимать границы router, service и repository.",
          "Подключить БД к FastAPI через async with и корректно закрывать сессию после запроса."
        ]
      },

      {
        type: "heading",
        text: "От слоёв к бизнес-сущностям"
      },

      {
        type: "text",
        html: "<p>В классической слоистой раскладке все модели находятся в <code>models/</code>, все схемы — в <code>schemas/</code>, а все обработчики — в <code>api/</code>. Такой вариант прозрачен для небольшого проекта, но при добавлении одной возможности приходится переходить между несколькими каталогами. В feature-based-подходе, наоборот, файлы одной предметной области собраны рядом: заказ — в <code>orders/</code>, блюдо — в <code>dishes/</code>, пользователь — в <code>users/</code>.</p>"
      },


      {
        type: "heading",
        text: "Гибридное дерево проекта"
      },

      {
        type: "code",
        lang: "text",
        text: "project/\n├── src/\n│   ├── main.py\n│   ├── config.py\n│   ├── database.py\n│   ├── api/\n│   │   └── dependencies.py\n│   ├── utils/\n│   │   └── db_manager.py\n│   ├── exceptions/\n│   │   └── orders.py\n│   ├── users/\n│   │   ├── models.py\n│   │   ├── schemas.py\n│   │   ├── repository.py\n│   │   ├── service.py\n│   │   └── router.py\n│   ├── dishes/\n│   │   ├── models.py\n│   │   ├── schemas.py\n│   │   ├── repository.py\n│   │   ├── service.py\n│   │   └── router.py\n│   └── orders/\n│       ├── models.py\n│       ├── schemas.py\n│       ├── repository.py\n│       ├── service.py\n│       └── router.py\n├── tests/\n│   ├── integration/\n│   │   └── orders/\n│   └── unit/\n├── alembic/\n├── pyproject.toml\n└── .env"
      },

      {
        type: "table",
        caption: "Граница ответственности",
        head: ["Компонент", "За что отвечает"],
        rows: [
          ["router.py", "HTTP-путь, параметры, response_model и перевод ошибок в HTTP-ответы"],
          ["service.py", "Прикладной сценарий и правила предметной области"],
          ["repository.py", "Запросы и изменения данных через AsyncSession"],
          ["models.py", "Отображение сущности на таблицу БД"],
          ["schemas.py", "Проверка входных данных и форма ответа API"],
          ["database.py / db_manager.py", "Фабрика и жизненный цикл асинхронной сессии"]
        ]
      },

      {
        type: "text",
        html: "<p>Папка бизнес-сущности не означает, что в каждом файле нужно дублировать подключение к БД. Общие ресурсы остаются в одном месте, а пакет сущности получает их через dependency. Так изменение правил заказа обычно затрагивает <code>orders/</code>, но не требует переписывать инфраструктуру пользователей или блюд.</p>"
      },

      {
        type: "heading",
        text: "Точка входа собирает приложение"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/main.py\nfrom fastapi import FastAPI\n\nfrom src.dishes.router import router as dishes_router\nfrom src.orders.router import router as orders_router\nfrom src.users.router import router as users_router\n\napp = FastAPI(title=\"Restaurant API\")\n\napp.include_router(users_router)\napp.include_router(dishes_router)\napp.include_router(orders_router)"
      },

      {
        type: "text",
        html: "<p><code>main.py</code> остаётся точкой сборки: создаёт приложение и подключает роутеры. Он не должен содержать SQL-запросы, хеширование паролей или правила смены статуса заказа. Такая граница упрощает чтение и тестирование.</p>"
      },

      {
        type: "heading",
        text: "Асинхронная фабрика сессий"
      },

      {
        type: "text",
        html: "<p>SQLAlchemy предоставляет <code>AsyncEngine</code> для асинхронного движка и <code>async_sessionmaker</code> как фабрику новых <code>AsyncSession</code>. В строке подключения должен быть асинхронный драйвер, например <code>postgresql+asyncpg</code> или <code>sqlite+aiosqlite</code>. Строку подключения удобно хранить в настройках, а не зашивать в код.</p>"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/database.py\nfrom sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine\nfrom sqlalchemy.orm import DeclarativeBase\n\nfrom src.config import settings\n\nengine = create_async_engine(settings.DB_URL)\nasync_session_maker = async_sessionmaker(\n    bind=engine,\n    expire_on_commit=False,\n)\n\n\nclass Base(DeclarativeBase):\n    pass"
      },

      {
        type: "note",
        tone: "tip",
        html: "<p><code>expire_on_commit=False</code> позволяет обращаться к уже загруженным атрибутам ORM-объекта после <code>commit()</code> без неожиданной попытки выполнить дополнительный ввод-вывод. Это настройка поведения сессии, а не замена явной загрузке связанных данных.</p>"
      },

      {
        type: "heading",
        text: "DBManager как асинхронный контекстный менеджер"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/utils/db_manager.py\nfrom src.orders.repository import OrdersRepository\n\n\nclass DBManager:\n    def __init__(self, session_factory):\n        self.session_factory = session_factory\n\n    async def __aenter__(self):\n        self.session = self.session_factory()\n        self.orders = OrdersRepository(self.session)\n        return self\n\n    async def __aexit__(self, exc_type, exc_value, traceback):\n        await self.session.rollback()\n        await self.session.close()\n\n    async def commit(self):\n        await self.session.commit()"
      },

      {
        type: "text",
        html: "<p>Методы <code>__aenter__</code> и <code>__aexit__</code> превращают <code>DBManager</code> в асинхронный контекстный менеджер. При входе создаётся сессия и репозитории, при выходе выполняются откат незавершённых изменений и закрытие сессии. Если внутри блока возникло исключение, код выхода всё равно освобождает ресурс. В полном приложении в <code>__aenter__</code> таким же образом регистрируются репозитории пользователей, блюд и других сущностей; здесь показан только <code>orders</code>, чтобы не перегружать пример.</p>"
      },

      {
        type: "heading",
        text: "Передача БД в FastAPI через dependency"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/api/dependencies.py\nfrom typing import Annotated\n\nfrom fastapi import Depends\n\nfrom src.database import async_session_maker\nfrom src.utils.db_manager import DBManager\n\n\nasync def get_db():\n    async with DBManager(async_session_maker) as db:\n        yield db\n\n\nDBDep = Annotated[DBManager, Depends(get_db)]"
      },

      {
        type: "text",
        html: "<p>FastAPI запускает dependency перед обработчиком, передаёт объект после <code>yield</code> в endpoint, а затем выполняет часть после <code>yield</code>. Поэтому жизненный цикл сессии привязан к запросу. В обработчике не нужно вручную вызывать <code>close()</code> — это обязанность контекстного менеджера.</p>"
      },

      {
        type: "note",
        tone: "warning",
        html: "<p>Не сохраняйте одну глобальную <code>AsyncSession</code> для всех запросов. Сессия — рабочий контекст конкретной операции; фабрика создаёт новые экземпляры, а dependency ограничивает их жизненный цикл запросом.</p>"
      },

      {
        type: "heading",
        text: "Repository: запросы к данным"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/orders/repository.py\nfrom sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nfrom src.orders.models import OrderModel\n\n\nclass OrdersRepository:\n    def __init__(self, session: AsyncSession):\n        self.session = session\n\n    async def get_by_id(self, order_id: int):\n        result = await self.session.execute(\n            select(OrderModel).where(OrderModel.id == order_id)\n        )\n        return result.scalar_one_or_none()"
      },

      {
        type: "text",
        html: "<p>Репозиторий знает, как составить запрос и получить результат, но не знает о HTTP. Он не должен решать, какой статус ответа вернуть клиенту. Один экземпляр репозитория использует сессию текущего <code>DBManager</code>.</p>"
      },

      {
        type: "heading",
        text: "Service: прикладной сценарий"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/orders/service.py\nfrom src.exceptions.orders import OrderNotFoundError\nfrom src.utils.db_manager import DBManager\n\n\nclass OrderService:\n    def __init__(self, db: DBManager):\n        self.db = db\n\n    async def get_order(self, order_id: int):\n        order = await self.db.orders.get_by_id(order_id)\n        if order is None:\n            raise OrderNotFoundError\n        return order"
      },

      {
        type: "text",
        html: "<p>Сервис координирует репозитории и проверяет правила предметной области. Например, перед созданием заказа он может проверить пользователя и доступность блюда. Для команд, которые меняют данные, сервис вызывает <code>await self.db.commit()</code> после завершения сценария; чтение не требует фиксации.</p>"
      },

      {
        type: "heading",
        text: "Router: HTTP-граница сущности"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/orders/router.py\nfrom fastapi import APIRouter\n\nfrom src.api.dependencies import DBDep\nfrom src.orders.schemas import OrderRead\nfrom src.orders.service import OrderService\n\nrouter = APIRouter(prefix=\"/orders\", tags=[\"Заказы\"])\n\n\n@router.get(\"/{order_id}\", response_model=OrderRead)\nasync def get_order(order_id: int, db: DBDep):\n    return await OrderService(db).get_order(order_id)"
      },

      {
        type: "text",
        html: "<p>Роутер связывает HTTP с сервисом: принимает параметры пути, получает <code>DBDep</code> и объявляет модель ответа. Перевод доменного исключения в <code>HTTPException</code> можно оставить в этом слое или вынести в общий обработчик — важно, чтобы repository не зависел от FastAPI.</p>"
      },

      {
        type: "heading",
        text: "Модель и схема остаются рядом с сущностью"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/orders/models.py\nfrom sqlalchemy import ForeignKey, String\nfrom sqlalchemy.orm import Mapped, mapped_column\n\nfrom src.database import Base\n\n\nclass OrderModel(Base):\n    __tablename__ = \"orders\"\n\n    id: Mapped[int] = mapped_column(primary_key=True)\n    description: Mapped[str] = mapped_column(String(500))\n    user_id: Mapped[int] = mapped_column(ForeignKey(\"users.id\"))"
      },

      {
        type: "code",
        lang: "python",
        text: "# src/orders/schemas.py\nfrom pydantic import BaseModel, ConfigDict\n\n\nclass OrderCreate(BaseModel):\n    description: str\n\n\nclass OrderRead(OrderCreate):\n    id: int\n    user_id: int\n\n    model_config = ConfigDict(from_attributes=True)"
      },

      {
        type: "text",
        html: "<p>ORM-модель описывает таблицу и связи с БД, а Pydantic-схема — публичный контракт API. Не отдавайте клиенту ORM-объект без продуманной схемы: поля, нужные для хранения, не всегда должны становиться частью ответа.</p>"
      },

        html: "<p>Адрес базы данных, режим отладки и секреты не должны зашиваться в коде. В этом уроке вынесем изменяемые настройки за пределы приложения, проверим их типы и подготовим конфигурацию к разным окружениям.</p>"

  "lesson-fastapi-setup-10": {

    title: "Внедрение зависимостей",
    blocks: [
      {
        type: "lead",
        html: "<p>Endpoint не должен сам искать настройки, открывать соединение с базой и повторять одну и ту же проверку в каждом маршруте. В FastAPI зависимость — это функция или класс, результат которого фреймворк подготавливает и передаёт обработчику.</p>"
      },

      {
        type: "heading",
        text: "Цели урока"
      },

      {
        type: "list",
        ordered: true,
        items: [
          "Объявлять зависимость через Depends и получать её результат в endpoint.",
          "Понимать вложенные, глобальные и асинхронные зависимости.",
          "Управлять ресурсом через yield и освобождать его после запроса.",

        ]

      {
        type: "heading",
        text: "Первая зависимость"
      },

      {
        type: "code",
        lang: "python",
        text: "from typing import Annotated\n\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def common_parameters(\n    q: str | None = None,\n    skip: int = 0,\n    limit: int = 100,\n):\n    return {\"q\": q, \"skip\": skip, \"limit\": limit}\n\n\n@app.get(\"/items/\")\nasync def read_items(\n    commons: Annotated[dict, Depends(common_parameters)],\n):\n    return commons"
      },

      {
        type: "text",
        html: "<p>Обработчик объявляет зависимость как параметр, а не вызывает <code>common_parameters()</code> вручную. FastAPI анализирует её параметры, получает значения из запроса, вызывает функцию и передаёт результат в <code>commons</code>. Та же зависимость может использоваться несколькими маршрутами.</p>"
      },

      {
        type: "heading",
        text: "Зависимости образуют дерево"
      },

      {
        type: "code",
        lang: "python",
        text: "def get_request_label():\n    return \"web\"\n\n\ndef get_context(label: str = Depends(get_request_label)):\n    return {\"label\": label}\n\n\n@app.get(\"/context\")\nasync def read_context(context: dict = Depends(get_context)):\n    return context"
      },

      {
        type: "text",
        html: "<p><code>get_context</code> зависит от <code>get_request_label</code>, поэтому FastAPI сначала разрешает нижний узел, затем передаёт его результат выше. В зависимости можно объявлять query-параметры, заголовки, cookies и другие зависимости. Функция при этом может быть обычной или асинхронной.</p>"

        type: "heading",
        text: "Ресурс с yield"

      {
        type: "code",
        lang: "python",
        text: "def get_db():\n    db = SessionLocal()\n    try:\n        yield db\n    finally:\n        db.close()\n\n\n@app.get(\"/users/\")\ndef read_users(db = Depends(get_db)):\n    return db.list_users()"
      },

      {
        type: "text",
        html: "<p>Код до <code>yield</code> подготавливает ресурс, значение после <code>yield</code> получает endpoint, а блок <code>finally</code> освобождает ресурс после завершения обработки. Поэтому сессия базы данных не остаётся открытой при каждом запросе. Для асинхронного ресурса применяйте <code>async def</code> и асинхронные операции очистки.</p>"

        type: "note",
        tone: "warning",
        html: "<p>Не храните одну рабочую сессию базы данных глобально для всех запросов. Зависимость должна ограничивать жизненный цикл ресурса и корректно закрывать его даже при исключении.</p>"

        text: "# app/db_manager.py\nfrom sqlalchemy.ext.asyncio import async_sessionmaker\n\nfrom app.dishes.repository import DishesRepository\nfrom app.orders.repository import OrdersRepository\nfrom app.shifts.repository import ShiftsRepository\nfrom app.users.repository import UsersRepository\n\n\nclass DBManager:\n    def __init__(self, async_session_maker: async_sessionmaker):\n        self.async_session_maker = async_session_maker\n\n    async def __aenter__(self):\n        self.session = self.async_session_maker()\n        self.users = UsersRepository(self.session)\n        self.dishes = DishesRepository(self.session)\n        self.orders = OrdersRepository(self.session)\n        self.shifts = ShiftsRepository(self.session)\n        return self\n\n    async def __aexit__(self, exc_type, exc_value, traceback):\n        try:\n            if self.session.in_transaction():\n                await self.session.rollback()\n        finally:\n            await self.session.close()\n\n    async def commit(self):\n        await self.session.commit()\n\n    async def rollback(self):\n        await self.session.rollback()\n\n\n# app/repository.py\nfrom pydantic import BaseModel\nfrom sqlalchemy import delete, select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\n\nclass BaseRepository:\n    model = None\n    schema = None\n\n    def __init__(self, session: AsyncSession):\n        self.session = session\n\n    def _to_schema(self, model):\n        return self.schema.model_validate(model, from_attributes=True)\n\n    async def get_all(self, *filters, **filter_by) -> list[BaseModel]:\n        filters = [item for item in filters if item is not None]\n        filter_by = {key: value for key, value in filter_by.items() if value is not None}\n        result = await self.session.execute(\n            select(self.model).where(*filters).filter_by(**filter_by)\n        )\n        return [self._to_schema(model) for model in result.scalars().all()]\n\n    async def get_one_or_none(self, **filter_by) -> BaseModel | None:\n        filter_by = {key: value for key, value in filter_by.items() if value is not None}\n        result = await self.session.execute(\n            select(self.model).filter_by(**filter_by)\n        )\n        model = result.scalars().one_or_none()\n        return None if model is None else self._to_schema(model)\n\n    async def add(self, data: BaseModel) -> BaseModel:\n        model = self.model(**data.model_dump())\n        self.session.add(model)\n        await self.session.flush()\n        return self._to_schema(model)\n\n    async def edit(\n        self, data: BaseModel, exclude_unset: bool = False, **filter_by\n    ) -> BaseModel | None:\n        model = await self.session.scalar(\n            select(self.model).filter_by(\n                **{key: value for key, value in filter_by.items() if value is not None}\n            )\n        )\n        if model is None:\n            return None\n\n        for key, value in data.model_dump(exclude_unset=exclude_unset).items():\n            setattr(model, key, value)\n        await self.session.flush()\n        return self._to_schema(model)\n\n    async def delete(self, *filters, **filter_by) -> bool:\n        filters = [item for item in filters if item is not None]\n        filter_by = {key: value for key, value in filter_by.items() if value is not None}\n        if not filters and not filter_by:\n            raise ValueError(\"Необходимо указать хотя бы одно условие удаления\")\n\n        stmt = delete(self.model).where(*filters)\n        for key, value in filter_by.items():\n            stmt = stmt.where(getattr(self.model, key) == value)\n        result = await self.session.execute(stmt)\n        return result.rowcount > 0\n\n\n# app/service.py\nfrom app.db_manager import DBManager\n\n\nclass BaseService:\n    def __init__(self, db: DBManager):\n        self.db = db\n\n\n# app/dependencies.py\nfrom typing import Annotated\n\nfrom fastapi import Depends\n\nfrom app.database import async_session_maker\nfrom app.db_manager import DBManager\n\n\nasync def get_db():\n    async with DBManager(async_session_maker) as db:\n        yield db\n\n\nDBDep = Annotated[DBManager, Depends(get_db)]\n\n\n# app/exceptions.py\nclass _AppError(Exception):\n    default_detail = \"Внутренняя ошибка приложения\"\n\n    def __init__(self, detail: str | None = None):\n        self.detail = detail or self.default_detail\n        super().__init__(self.detail)\n\n\nclass NotFoundError(_AppError):\n    default_detail = \"Объект не найден\"\n\n\nclass ConflictError(_AppError):\n    default_detail = \"Конфликт данных\"\n\n\nclass AuthenticationError(_AppError):\n    default_detail = \"Требуется аутентификация\"\n\n\nclass AuthorizationError(_AppError):\n    default_detail = \"Недостаточно прав\""

        type: "code",

        text: "# app/users/models.py\nfrom sqlalchemy import text\nfrom sqlalchemy.orm import Mapped, mapped_column\n\nfrom app.database import Base, int_pk, str_uniq\n\n\nclass User(Base):\n    id: Mapped[int_pk]\n    email: Mapped[str_uniq]\n    password: Mapped[str]\n    name: Mapped[str]\n    last_name: Mapped[str]\n    phone: Mapped[str_uniq]\n\n    is_user: Mapped[bool] = mapped_column(\n        default=True, server_default=text(\"true\"), nullable=False\n    )\n    is_waiter: Mapped[bool] = mapped_column(\n        default=False, server_default=text(\"false\"), nullable=False\n    )\n    is_chef: Mapped[bool] = mapped_column(\n        default=False, server_default=text(\"false\"), nullable=False\n    )\n    is_super_admin: Mapped[bool] = mapped_column(\n        default=False, server_default=text(\"false\"), nullable=False\n    )\n\n    def __repr__(self):\n        return f\"{self.__class__.__name__}(id={self.id})\"\n\n\n# app/users/schemas.py\nimport re\nfrom collections.abc import Mapping\nfrom enum import Enum\nfrom typing import Any\n\nfrom pydantic import (\n    BaseModel,\n    ConfigDict,\n    EmailStr,\n    Field,\n    field_validator,\n    model_validator,\n)\n\n\nclass Role(str, Enum):\n    intern = \"Стажёр\"\n    waiter = \"Официант\"\n    chef = \"Повар\"\n    super_admin = \"Супер-Администратор\"\n\n\nROLE_FLAGS = {\n    Role.intern: {\n        \"is_user\": True,\n        \"is_waiter\": False,\n        \"is_chef\": False,\n        \"is_super_admin\": False,\n    },\n    Role.waiter: {\n        \"is_user\": False,\n        \"is_waiter\": True,\n        \"is_chef\": False,\n        \"is_super_admin\": False,\n    },\n    Role.chef: {\n        \"is_user\": False,\n        \"is_waiter\": False,\n        \"is_chef\": True,\n        \"is_super_admin\": False,\n    },\n    Role.super_admin: {\n        \"is_user\": False,\n        \"is_waiter\": False,\n        \"is_chef\": False,\n        \"is_super_admin\": True,\n    },\n}\n\n\ndef role_flags(role: Role) -> dict[str, bool]:\n    return ROLE_FLAGS[Role(role)].copy()\n\n\ndef role_from_flags(value: Mapping[str, Any] | object) -> Role:\n    def get(name: str) -> bool:\n        if isinstance(value, Mapping):\n            return bool(value.get(name))\n        return bool(getattr(value, name, False))\n\n    matches = [\n        role\n        for role, flags in ROLE_FLAGS.items()\n        if all(get(name) == expected for name, expected in flags.items())\n    ]\n    if len(matches) != 1:\n        raise ValueError(\"У пользователя должна быть ровно одна роль\")\n    return matches[0]\n\n\nclass UserRegister(BaseModel):\n    email: EmailStr = Field(..., description=\"Электронная почта\")\n    password: str = Field(\n        ..., min_length=5, max_length=50, description=\"Пароль, от 5 до 50 знаков\"\n    )\n    phone: str = Field(..., description=\"Номер телефона в международном формате\")\n    name: str = Field(..., min_length=3, max_length=50, description=\"Имя\")\n    last_name: str = Field(\n        ..., min_length=3, max_length=50, description=\"Фамилия\"\n    )\n\n    @field_validator(\"phone\")\n    @classmethod\n    def validate_phone(cls, value: str) -> str:\n        if not re.fullmatch(r\"\\+\\d{5,15}\", value):\n            raise ValueError(\n                'Номер телефона должен начинаться с \"+\" и содержать от 5 до 15 цифр'\n            )\n        return value\n\n\nclass UserCreate(UserRegister):\n    role: Role\n\n\nclass UserLogin(BaseModel):\n    email: EmailStr\n    password: str = Field(..., min_length=5, max_length=50)\n\n\nclass UserUpdate(BaseModel):\n    email: EmailStr | None = None\n    password: str | None = Field(default=None, min_length=5, max_length=50)\n    phone: str | None = None\n    name: str | None = Field(default=None, min_length=3, max_length=50)\n    last_name: str | None = Field(default=None, min_length=3, max_length=50)\n\n    @field_validator(\"phone\")\n    @classmethod\n    def validate_phone(cls, value: str | None) -> str | None:\n        if value is not None and not re.fullmatch(r\"\\+\\d{5,15}\", value):\n            raise ValueError(\n                'Номер телефона должен начинаться с \"+\" и содержать от 5 до 15 цифр'\n            )\n        return value\n\n    @model_validator(mode=\"after\")\n    def require_field(self):\n        if not any(\n            getattr(self, field) is not None\n            for field in (\"email\", \"password\", \"phone\", \"name\", \"last_name\")\n        ):\n            raise ValueError(\"Нужно указать хотя бы одно поле для обновления\")\n        return self\n\n\nclass UserRoleUpdate(BaseModel):\n    role: Role\n\n\nclass UserRead(BaseModel):\n    id: int\n    email: EmailStr\n    phone: str\n    name: str\n    last_name: str\n    role: Role\n\n    model_config = ConfigDict(from_attributes=True)\n\n    @model_validator(mode=\"before\")\n    @classmethod\n    def derive_role(cls, value: Any):\n        if isinstance(value, BaseModel):\n            data = value.model_dump()\n        elif isinstance(value, Mapping):\n            data = dict(value)\n        else:\n            data = {\n                field: getattr(value, field)\n                for field in (\n                    \"id\",\n                    \"email\",\n                    \"phone\",\n                    \"name\",\n                    \"last_name\",\n                    \"role\",\n                    \"is_user\",\n                    \"is_waiter\",\n                    \"is_chef\",\n                    \"is_super_admin\",\n                )\n                if hasattr(value, field)\n            }\n        if not data.get(\"role\"):\n            data[\"role\"] = role_from_flags(data)\n        return data\n\n\nclass TokenResponse(BaseModel):\n    access_token: str\n    token_type: str = \"bearer\"\n    redirect_to: str\n\n\nSUserRegister = UserRegister\nSUserAdd = UserCreate\nSUserAuth = UserLogin\nSUserUPD = UserUpdate\nSUserUpdRole = UserRoleUpdate\nSUser = UserRead\nRoleUpdate = UserRoleUpdate"

        lang: "python",
        text: "# app/users/schemas.py — добавьте к схемам из урока 06\nfrom datetime import datetime\n\nfrom pydantic import BaseModel, ConfigDict, EmailStr\n\n\nclass UserRepositorySchema(BaseModel):\n    id: int\n    email: EmailStr\n    password: str\n    name: str\n    last_name: str\n    phone: str\n    is_user: bool\n    is_waiter: bool\n    is_chef: bool\n    is_super_admin: bool\n    created_at: datetime\n    updated_at: datetime\n\n    model_config = ConfigDict(from_attributes=True)\n\n\nclass UserRepositoryCreate(BaseModel):\n    email: EmailStr\n    password: str\n    name: str\n    last_name: str\n    phone: str\n    is_user: bool\n    is_waiter: bool\n    is_chef: bool\n    is_super_admin: bool\n\n\nclass UserRepositoryPatch(BaseModel):\n    email: EmailStr | None = None\n    password: str | None = None\n    name: str | None = None\n    last_name: str | None = None\n    phone: str | None = None\n    is_user: bool | None = None\n    is_waiter: bool | None = None\n    is_chef: bool | None = None\n    is_super_admin: bool | None = None\n\n\n# app/users/repository.py\nfrom pydantic import EmailStr\nfrom sqlalchemy import exists, select\n\nfrom app.orders.models import Order\nfrom app.repository import BaseRepository\nfrom app.shifts.models import Shift\nfrom app.users.models import User\nfrom app.users.schemas import UserRepositorySchema\n\n\nclass UsersRepository(BaseRepository):\n    model = User\n    schema = UserRepositorySchema\n\n    async def get_user_with_hashed_password(\n        self, email: EmailStr\n    ) -> UserRepositorySchema | None:\n        return await self.get_one_or_none(email=email)\n\n    async def has_orders(self, user_id: int) -> bool:\n        return bool(\n            await self.session.scalar(\n                select(exists().where(Order.user_id == user_id))\n            )\n        )\n\n    async def has_shifts(self, user_id: int) -> bool:\n        return bool(\n            await self.session.scalar(\n                select(exists().where(Shift.user_id == user_id))\n            )\n        )"
