<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Интерактивный учебник: уроки, тесты и мини-игры в браузере. Прогресс сохраняется автоматически.">
  <meta name="theme-color" content="#f4f0e8">
  <title>Учебник — Главная</title>
  <style>
/* ==========================================================================
   Учебник — единый файл стилей
   Темы: светлая (по умолчанию) и тёмная через [data-theme="dark"].
   ========================================================================== */

/* ---------- Переменные и сброс ---------- */
:root {
  --bg: #f5f6fb;
  --bg-soft: #eceef7;
  --card: #ffffff;
  --card-soft: #f8f9fd;
  --text: #1c2333;
  --text-soft: #48526b;
  --muted: #8a93a8;
  --border: #e4e7f0;
  --accent: #6c5ce7;
  --accent-2: #00b3d9;
  --accent-soft: rgba(108, 92, 231, 0.1);
  --gradient: linear-gradient(135deg, #6c5ce7 0%, #00b3d9 100%);
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.12);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.14);
  --radius: 18px;
  --radius-sm: 10px;
  --radius-lg: 26px;
  --shadow: 0 6px 24px rgba(28, 35, 51, 0.07);
  --shadow-lg: 0 18px 44px rgba(28, 35, 51, 0.13);
  --header-bg: rgba(255, 255, 255, 0.85);
  --hero-glow: radial-gradient(600px 300px at 25% 0%, rgba(108, 92, 231, 0.14), transparent 65%);
  --tok-cmt: #7d879c;
  --tok-str: #0f9d6a;
  --tok-num: #d97706;
  --tok-kw: #6c5ce7;
  --tok-bi: #2563eb;
  --tok-fn: #0091a8;
  --tok-dec: #db2777;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0f1218;
  --bg-soft: #161b25;
  --card: #1a212e;
  --card-soft: #202838;
  --text: #e8ecf4;
  --text-soft: #a9b3c6;
  --muted: #68738a;
  --border: #28303f;
  --accent: #8e7cf8;
  --accent-2: #3dd1e6;
  --accent-soft: rgba(142, 124, 248, 0.14);
  --gradient: linear-gradient(135deg, #8e7cf8 0%, #3dd1e6 100%);
  --success: #34d399;
  --success-soft: rgba(52, 211, 153, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  --warning: #fbbf24;
  --warning-soft: rgba(251, 191, 36, 0.16);
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.5);
  --header-bg: rgba(15, 18, 24, 0.85);
  --hero-glow: radial-gradient(600px 300px at 25% 0%, rgba(142, 124, 248, 0.16), transparent 65%);
  --tok-cmt: #6a7590;
  --tok-str: #34d399;
  --tok-num: #fbbf24;
  --tok-kw: #8e7cf8;
  --tok-bi: #7cb3ff;
  --tok-fn: #3dd1e6;
  --tok-dec: #f472b6;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { color: var(--accent); }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.container {
  width: 100%;
  max-width: 1024px;
  margin: 0 auto;
  padding: 0 20px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: #fff;
  padding: 10px 16px;
  border-radius: 0 0 10px 0;
  z-index: 100;
}
.skip-link:focus { left: 0; }

/* ---------- Шапка ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-top: 14px;
  padding-bottom: 14px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
  font-weight: 700;
  font-size: 1.1rem;
}
.brand-logo { font-size: 1.5rem; line-height: 1; }

.main-nav {
  display: flex;
  gap: 4px;
  margin-left: 8px;
}
.main-nav a {
  text-decoration: none;
  color: var(--text-soft);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 7px 14px;
  border-radius: 999px;
  transition: background 0.2s, color 0.2s;
}
.main-nav a:hover { background: var(--bg-soft); color: var(--text); }
.main-nav a.is-active { background: var(--accent-soft); color: var(--accent); }

.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-soft);
  white-space: nowrap;
}
.progress-pill-bar {
  width: 56px;
  height: 6px;
  border-radius: 99px;
  background: var(--bg-soft);
  overflow: hidden;
}
.progress-pill-bar span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--gradient);
  width: 0%;
  transition: width 0.5s ease;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
}
.icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--accent); }

/* ---------- Кнопки и бейджи ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: none;
  border-radius: 999px;
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--gradient);
  color: #fff;
  box-shadow: 0 8px 20px rgba(108, 92, 231, 0.35);
}
.btn-primary:hover { box-shadow: 0 12px 28px rgba(108, 92, 231, 0.45); transform: translateY(-2px); }

.btn-ghost {
  background: transparent;
  color: var(--text-soft);
  border: 2px solid var(--border);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

.btn-soft {
  background: var(--accent-soft);
  color: var(--accent);
}
.btn-soft:hover { background: var(--bg-soft); }

.btn-sm { padding: 8px 16px; font-size: 0.9rem; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.badge-soft { background: var(--bg-soft); color: var(--text-soft); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }

/* ---------- Прогресс-бары ---------- */
.progress-track {
  height: 8px;
  border-radius: 99px;
  background: var(--bg-soft);
  overflow: hidden;
}
.progress-fill {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--gradient);
  transition: width 0.6s ease;
}

/* ---------- Главная ---------- */
.hero {
  position: relative;
  padding: 72px 0 40px;
  text-align: center;
  background: var(--hero-glow);
}
.hero-eyebrow {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 700;
}
.hero h1 {
  margin: 22px 0 12px;
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.hero h1 .grad-text {
  background: var(--gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-sub {
  max-width: 620px;
  margin: 0 auto 28px;
  color: var(--text-soft);
  font-size: 1.1rem;
}
.hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
  margin: 40px 0;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-value {
  font-size: 1.9rem;
  font-weight: 800;
  background: var(--gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.stat-label { color: var(--muted); font-size: 0.85rem; font-weight: 600; margin-top: 4px; }

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.35rem;
  margin: 8px 0 22px;
}
.section-title .emoji { font-size: 1.5rem; }

.section-cards {
  display: grid;
  gap: 16px;
  margin-bottom: 48px;
}

.section-card {
  display: block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.25s, border-color 0.2s;
}
.section-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
.section-card-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
}
.section-card-icon {
  width: 52px;
  height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  border-radius: 14px;
  background: var(--gradient);
  color: #fff;
  flex-shrink: 0;
}
.section-card h3 { margin: 0; font-size: 1.15rem; }
.section-card-meta { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
.section-card-desc { color: var(--text-soft); margin: 0 0 16px; }
.section-card-bottom { display: flex; align-items: center; gap: 14px; }
.section-card-bottom .progress-track { flex: 1; }
.section-card-pct { font-size: 0.85rem; font-weight: 700; color: var(--text-soft); white-space: nowrap; }

/* ---------- Содержание ---------- */
.page-head {
  padding: 40px 0 10px;
}
.page-head h1 { margin: 6px 0 8px; font-size: clamp(1.7rem, 4vw, 2.4rem); letter-spacing: -0.01em; }
.page-head p { color: var(--text-soft); margin: 0; max-width: 640px; }

.toc-section { margin-bottom: 36px; }

.toc-section-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.toc-section-icon {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  border-radius: 12px;
  background: var(--gradient);
  color: #fff;
  flex-shrink: 0;
}
.toc-section-head h2 { margin: 0; font-size: 1.3rem; flex: 1; }
.toc-section-head .pct { font-size: 0.9rem; font-weight: 800; color: var(--accent); }

.topic-list {
  display: grid;
  gap: 10px;
}

.topic-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
}
.topic-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-lg); }
.topic-card.is-disabled { opacity: 0.55; pointer-events: none; }

.topic-num {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: var(--bg-soft);
  color: var(--muted);
  font-weight: 800;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.topic-card.is-done .topic-num { background: var(--success-soft); color: var(--success); }

.topic-icon { font-size: 1.3rem; line-height: 1; }

.topic-main { flex: 1; min-width: 0; }
.topic-title { font-weight: 700; margin-bottom: 4px; }
.topic-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topic-meta .mini-bar { width: 110px; height: 6px; }

.topic-status {
  font-size: 0.78rem;
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 10px;
  white-space: nowrap;
}
.topic-status.new { background: var(--bg-soft); color: var(--muted); }
.topic-status.progress { background: var(--warning-soft); color: var(--warning); }
.topic-status.done { background: var(--success-soft); color: var(--success); }

.topic-arrow { color: var(--muted); font-size: 1.1rem; transition: transform 0.2s, color 0.2s; }
.topic-card:hover .topic-arrow { transform: translateX(4px); color: var(--accent); }

.toc-actions {
  margin: 30px 0 10px;
  display: flex;
  justify-content: center;
}

/* ---------- Урок ---------- */
.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.9rem;
  padding-top: 26px;
}
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumb-current { color: var(--text-soft); font-weight: 600; }

.lesson-head { margin: 14px 0 30px; }
.lesson-head h1 { margin: 10px 0 10px; font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2; }
.lesson-head .badges { display: flex; gap: 8px; flex-wrap: wrap; }

.blocks { display: flex; flex-direction: column; gap: 22px; }

.block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px;
  box-shadow: var(--shadow);
}

.block-heading {
  margin: 0;
  font-size: 1.4rem;
  letter-spacing: -0.01em;
  padding: 0;
  background: none;
  border: none;
  box-shadow: none;
}
.block-heading::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 24px;
  border-radius: 99px;
  background: var(--gradient);
  margin-right: 12px;
  vertical-align: -4px;
}

.block-lead {
  font-size: 1.15rem;
  color: var(--text-soft);
  padding: 20px 26px;
  background: linear-gradient(135deg, var(--accent-soft), transparent);
  border: 1px solid var(--border);
}
.block-lead p { margin: 0; }

.block-text { color: var(--text-soft); }
.block-text p { margin: 0 0 1em; }
.block-text p:last-child { margin-bottom: 0; }
.block-text strong { color: var(--text); }

.block-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.block-list li {
  position: relative;
  padding-left: 34px;
  color: var(--text-soft);
}
.block-list li::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 9px;
  width: 14px;
  height: 14px;
  border-radius: 5px;
  background: var(--accent-soft);
  border: 2px solid var(--accent);
}
.block-list.ordered li::before {
  content: counter(lesson-list-item);
  counter-increment: lesson-list-item;
  background: var(--gradient);
  border: none;
  color: #fff;
  font-size: 0.65rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.block-list.ordered { counter-reset: lesson-list-item; }

.block-quote {
  margin: 0;
  padding: 20px 24px;
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: var(--card-soft);
}
.block-quote p { margin: 0 0 6px; font-style: italic; font-size: 1.05rem; }
.block-quote footer { color: var(--muted); font-size: 0.85rem; }

.note {
  padding: 18px 22px;
  border-radius: var(--radius-sm);
  font-size: 0.97rem;
  color: var(--text-soft);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.note .note-icon { font-size: 1.2rem; line-height: 1.4; flex-shrink: 0; }
.note p { margin: 0; }
.note strong { color: var(--text); }
.note-info { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.note-tip { background: var(--success-soft); border-left: 4px solid var(--success); }
.note-warning { background: var(--warning-soft); border-left: 4px solid var(--warning); }

/* ---------- Активности (тесты и игры) ---------- */
.activity { padding: 28px; }

.activity-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.activity-head h3 { margin: 0; font-size: 1.15rem; }
.activity-icon {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  border-radius: 10px;
  background: var(--gradient);
  color: #fff;
  flex-shrink: 0;
}

.result-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  margin: 14px 0;
  font-weight: 700;
  font-size: 0.95rem;
}
.result-banner.passed { background: var(--success-soft); color: var(--success); }
.result-banner.failed { background: var(--danger-soft); color: var(--danger); }
.result-banner.warn { background: var(--warning-soft); color: var(--warning); }

/* --- Тест (quiz) --- */
.quiz-question { font-size: 1.1rem; font-weight: 700; margin: 10px 0 16px; }
.quiz-hint { color: var(--muted); font-size: 0.85rem; margin: -8px 0 14px; }

.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.quiz-option {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--text);
  font-size: 1rem;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
}
.quiz-option:hover:not(:disabled) { border-color: var(--accent); transform: translateX(2px); }
.quiz-option.selected { border-color: var(--accent); background: var(--accent-soft); }
.quiz-option.is-correct { border-color: var(--success); background: var(--success-soft); }
.quiz-option.is-wrong { border-color: var(--danger); background: var(--danger-soft); }
.quiz-option:disabled { cursor: default; opacity: 0.85; }

.quiz-letter {
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: var(--bg-soft);
  color: var(--muted);
  font-weight: 800;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.quiz-option.selected .quiz-letter,
.quiz-option.is-correct .quiz-letter { background: var(--gradient); color: #fff; }
.quiz-option.is-wrong .quiz-letter { background: var(--danger); color: #fff; }

.quiz-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.quiz-explanation {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  background: var(--card-soft);
  border-left: 4px solid var(--accent);
  font-size: 0.95rem;
  color: var(--text-soft);
  animation: fade-up 0.3s ease;
}

/* --- Правда / ложь --- */
.tf-statement {
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.tf-statement.locked { border-color: var(--accent); }
.tf-statement.locked.is-correct { border-color: var(--success); }
.tf-statement.locked.is-wrong { border-color: var(--danger); }

.tf-text { font-weight: 600; margin-bottom: 10px; }
.tf-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tf-btn {
  padding: 8px 20px;
  border: 2px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  color: var(--text-soft);
  font-weight: 700;
  font-size: 0.9rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.tf-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.tf-btn.chosen { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tf-btn.chosen.is-correct { border-color: var(--success); background: var(--success-soft); color: var(--success); }
.tf-btn.chosen.is-wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.tf-btn:disabled { cursor: default; opacity: 0.7; }

.tf-explanation { margin-top: 10px; font-size: 0.9rem; color: var(--muted); animation: fade-up 0.3s ease; }

/* --- Карточки (флипы) --- */
.flcard-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 6px 0;
}

.flcard3d {
  width: 100%;
  max-width: 420px;
  height: 230px;
  perspective: 1200px;
  cursor: pointer;
}
.flcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.flcard3d.flipped .flcard-inner { transform: rotateY(180deg); }
.flcard-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
  text-align: center;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  font-size: 1.15rem;
  font-weight: 700;
  overflow: auto;
}
.flcard-front { background: var(--gradient); color: #fff; box-shadow: var(--shadow); }
.flcard-back {
  background: var(--card);
  transform: rotateY(180deg);
  font-weight: 500;
  color: var(--text-soft);
  box-shadow: var(--shadow);
  font-size: 1.05rem;
}

.flcard-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.flcard-counter { color: var(--muted); font-size: 0.9rem; font-weight: 700; min-width: 86px; text-align: center; }
.flcard-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.flcard-dot {
  width: 9px;
  height: 9px;
  border-radius: 99px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.flcard-dot.seen { background: var(--success); border-color: var(--success); }
.flcard-dot.current { box-shadow: 0 0 0 3px var(--accent-soft); }

/* --- Найди пару (память) --- */
.memory-grid {
  display: grid;
  gap: 10px;
  margin: 14px 0;
}
.memory-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.memory-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.memory-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

.mem-card {
  position: relative;
  height: 96px;
  perspective: 800px;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  font-family: inherit;
}
.mem-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.3, 1);
  border-radius: var(--radius-sm);
}
.mem-card.open .mem-inner { transform: rotateY(180deg); }
.mem-card.matched .mem-inner { transform: rotateY(180deg); }
.mem-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  text-align: center;
  font-size: 0.9rem;
  font-weight: 700;
  border-radius: var(--radius-sm);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.mem-front { background: var(--gradient); color: #fff; font-size: 1.4rem; }
.mem-back {
  background: var(--card-soft);
  transform: rotateY(180deg);
  border: 2px solid var(--border);
  color: var(--text-soft);
}
.mem-card.matched .mem-back { border-color: var(--success); background: var(--success-soft); color: var(--success); }
.mem-card.shake .mem-inner { animation: shake 0.4s ease; }

.memory-stats { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--muted); font-weight: 600; font-size: 0.9rem; }

/* ---------- Конец урока ---------- */
.lesson-end { margin-top: 30px; }
.end-sentinel { height: 1px; }

.lesson-end-card {
  text-align: center;
  padding: 44px 26px;
  border-radius: var(--radius-lg);
  background: linear-gradient(160deg, var(--accent-soft), var(--card) 60%);
  border: 1px solid var(--border);
}
.lesson-end-icon { font-size: 3.2rem; line-height: 1; }
.lesson-end h2 { margin: 14px 0 8px; font-size: 1.6rem; }
.lesson-end p { color: var(--text-soft); max-width: 520px; margin: 0 auto 18px; }
.lesson-end .progress-wrap { max-width: 380px; margin: 0 auto; }
.lesson-end .progress-wrap .mini { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }

.lesson-nav {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  margin: 22px 0 40px;
  flex-wrap: wrap;
}
.lesson-nav .btn { flex: 1; min-width: 180px; }

/* ---------- Toast ---------- */
#toast-root {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 12px 22px;
  font-weight: 700;
  font-size: 0.95rem;
  box-shadow: var(--shadow-lg);
  animation: toast-in 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 90vw;
}
.toast.out { animation: toast-out 0.3s ease forwards; }

/* ---------- Подвал ---------- */
.site-footer {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding: 26px 0;
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
}
.footer-inner p { margin: 0; }

/* ---------- Анимации ---------- */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(14px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toast-out {
  to { opacity: 0; transform: translateY(10px); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0) rotateY(180deg); }
  25% { transform: translateX(-7px) rotateY(180deg); }
  75% { transform: translateX(7px) rotateY(180deg); }
}

.fade-in { animation: fade-up 0.35s ease both; }
.fade-in-delay-1 { animation: fade-up 0.35s ease 0.08s both; }
.fade-in-delay-2 { animation: fade-up 0.35s ease 0.16s both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Восстанови код (codefill) ---------- */
.cf-code {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin: 0 0 16px;
  overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.92rem;
  line-height: 1.8;
  white-space: pre;
  color: var(--text);
}
.cf-code:not(.code-copyable),
.block-code:not(.code-copyable) {
  -webkit-user-select: none;
  user-select: none;
}
.cf-select {
  font-family: inherit;
  font-size: 0.9rem;
  padding: 1px 8px;
  margin: 0 3px;
  border-radius: 8px;
  border: 2px solid var(--accent);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  max-width: 240px;
}
.cf-select:disabled { cursor: default; opacity: 0.9; }
.cf-select.is-correct { border-color: var(--success); background: var(--success-soft); color: var(--success); }
.cf-select.is-wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

/* ---------- Инлайн-код в текстовых блоках ---------- */
.block code,
.block-text code,
.block-list code,
.note code {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1px 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  color: var(--accent);
  white-space: nowrap;
}

/* ---------- Листинги кода (code) ---------- */
.block-code {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.9rem;
  line-height: 1.65;
  color: var(--text);
  margin: 0 0 16px;
}
.block-code code {
  background: none;
  border: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
  white-space: pre;
}

/* ---------- Подсветка синтаксиса ---------- */
.tok-cmt { color: var(--tok-cmt); font-style: italic; }
.tok-str { color: var(--tok-str); }
.tok-num { color: var(--tok-num); }
.tok-kw { color: var(--tok-kw); font-weight: 600; }
.tok-bi { color: var(--tok-bi); }
.tok-fn { color: var(--tok-fn); }
.tok-dec { color: var(--tok-dec); }
.cf-code .tok-cmt, .block-code .tok-cmt { font-style: italic; }

/* ---------- Таблицы (table) ---------- */
.block-table-wrap { overflow-x: auto; margin-bottom: 16px; }
.block-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}
.block-table caption {
  text-align: left;
  font-weight: 700;
  padding-bottom: 8px;
  color: var(--text);
}
.block-table th,
.block-table td {
  text-align: left;
  padding: 8px 12px;
  border: 1px solid var(--border);
  vertical-align: top;
}
.block-table th {
  background: var(--bg-soft);
  color: var(--text);
  font-weight: 700;
  white-space: nowrap;
}
.block-table td { color: var(--text-soft); }
.block-table tbody tr:nth-child(even) { background: var(--bg-soft); }

/* ---------- Адаптив ---------- */
@media (max-width: 640px) {
  body { font-size: 16px; }
  .header-inner { flex-wrap: wrap; gap: 10px; }
  .header-actions { margin-left: auto; }
  .progress-pill { display: none; }
  .main-nav { order: 3; width: 100%; justify-content: center; }
  .hero { padding: 48px 0 30px; }
  .block, .activity { padding: 20px; }
  .memory-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .memory-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
  .flcard3d { height: 200px; }
  .toc-section-head { align-items: flex-start; }
  .topic-card { flex-wrap: wrap; }
  .lesson-nav .btn { flex: 1 1 100%; }
}

/* ========================================================================== 
   Редизайн: тёплая редакционная система
   ========================================================================== */

:root {
  --bg: #f4f0e8;
  --bg-soft: #e9e3d8;
  --card: #fbfaf7;
  --card-soft: #f1ece3;
  --text: #25221f;
  --text-soft: #625c54;
  --muted: #958d82;
  --border: #d9d0c4;
  --accent: #b95035;
  --accent-2: #b95035;
  --accent-soft: rgba(185, 80, 53, 0.11);
  --gradient: var(--accent);
  --success: #39745a;
  --success-soft: rgba(57, 116, 90, 0.12);
  --danger: #b34d43;
  --danger-soft: rgba(179, 77, 67, 0.11);
  --warning: #a56f2c;
  --warning-soft: rgba(165, 111, 44, 0.13);
  --radius: 14px;
  --radius-sm: 8px;
  --radius-lg: 22px;
  --shadow: 0 8px 24px rgba(74, 58, 42, 0.06);
  --shadow-lg: 0 18px 42px rgba(74, 58, 42, 0.12);
  --header-bg: rgba(244, 240, 232, 0.9);
  --hero-glow: none;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #1b1917;
  --bg-soft: #27231f;
  --card: #24211e;
  --card-soft: #2d2924;
  --text: #f2ede5;
  --text-soft: #c2b9ae;
  --muted: #8d8479;
  --border: #403932;
  --accent: #d4775b;
  --accent-2: #d4775b;
  --accent-soft: rgba(212, 119, 91, 0.15);
  --gradient: var(--accent);
  --success: #73b38f;
  --success-soft: rgba(115, 179, 143, 0.15);
  --danger: #e38175;
  --danger-soft: rgba(227, 129, 117, 0.14);
  --warning: #d6a25c;
  --warning-soft: rgba(214, 162, 92, 0.15);
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.35);
  --header-bg: rgba(27, 25, 23, 0.9);
  color-scheme: dark;
}

body {
  font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
  letter-spacing: -0.005em;
  background-color: var(--bg);
  background-image: radial-gradient(circle at 12% 0%, rgba(185, 80, 53, 0.055), transparent 28rem);
}

[data-theme="dark"] body {
  background-image: radial-gradient(circle at 12% 0%, rgba(212, 119, 91, 0.08), transparent 28rem);
}

h1, h2, h3, .brand-name, .stat-value, .hero-aside-number {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 700;
  letter-spacing: -0.035em;
}

h1, h2, h3, p { text-wrap: pretty; }

.container {
  max-width: 1180px;
  padding-left: 28px;
  padding-right: 28px;
}

.site-header {
  box-shadow: 0 1px 0 rgba(74, 58, 42, 0.04);
}

.header-inner {
  min-height: 72px;
  padding-top: 10px;
  padding-bottom: 10px;
}

.brand { gap: 11px; font-size: 1.15rem; }
.brand-logo {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  font-family: Georgia, serif;
  font-size: 1.35rem;
  line-height: 1;
  transform: rotate(-7deg);
}
.brand-name { letter-spacing: -0.04em; }

.main-nav { gap: 22px; margin-left: 28px; }
.main-nav a {
  position: relative;
  padding: 22px 0 19px;
  border-radius: 0;
  font-size: 0.86rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.main-nav a:hover { background: transparent; color: var(--accent); }
.main-nav a.is-active { background: transparent; color: var(--text); }
.main-nav a.is-active::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 12px;
  left: 0;
  height: 2px;
  background: var(--accent);
}

.progress-pill {
  border: 0;
  border-left: 1px solid var(--border);
  border-radius: 0;
  padding: 7px 0 7px 18px;
  background: transparent;
  font-variant-numeric: tabular-nums;
}
.progress-pill-bar { width: 72px; height: 4px; background: var(--bg-soft); }
.progress-pill-bar span { background: var(--accent); }
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  background: transparent;
  font-size: 1rem;
}
.icon-btn:hover { background: var(--accent-soft); box-shadow: none; }

.btn {
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 0.92rem;
  letter-spacing: 0.01em;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.btn-primary {
  background: var(--accent);
  box-shadow: 0 8px 18px rgba(185, 80, 53, 0.2);
}
.btn-primary:hover { background: #9f3f28; box-shadow: 0 12px 24px rgba(185, 80, 53, 0.26); }
.btn-ghost { border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--card); }
.btn-soft { border: 1px solid transparent; }
.btn-sm { padding: 8px 13px; }
.text-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--text-soft);
  font-size: 0.92rem;
  font-weight: 700;
  text-decoration: none;
  transition: color 0.2s ease, gap 0.2s ease;
}
.text-link:hover { color: var(--accent); gap: 10px; }

.badge {
  border-radius: 5px;
  padding: 4px 9px;
  font-size: 0.72rem;
  letter-spacing: 0.035em;
  text-transform: uppercase;
}
.badge-accent { background: var(--accent); color: #fff; }

.progress-track { height: 5px; border-radius: 2px; background: var(--bg-soft); }
.progress-fill { border-radius: 2px; background: var(--accent); }

/* Главная: hero с выраженным левым фокусом и самостоятельной карточкой маршрута. */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(230px, 0.55fr);
  gap: 44px;
  align-items: end;
  padding: 94px 0 74px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.hero-eyebrow {
  grid-column: 1;
  display: inline-block;
  width: fit-content;
  padding: 0;
  color: var(--accent);
  background: transparent;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero h1 {
  grid-column: 1;
  margin: 17px 0 14px;
  font-size: clamp(2.7rem, 6vw, 5.4rem);
  line-height: 0.98;
  letter-spacing: -0.065em;
  text-wrap: balance;
}
.hero h1 .grad-text { color: var(--accent); background: none; }
.hero-sub {
  grid-column: 1;
  max-width: 570px;
  margin: 0 0 28px;
  color: var(--text-soft);
  font-size: 1.05rem;
  line-height: 1.65;
}
.hero-actions { grid-column: 1; justify-content: flex-start; gap: 20px; }
.hero-aside {
  grid-column: 2;
  grid-row: 1 / span 4;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px 0 5px 28px;
  border-left: 1px solid var(--border);
}
.hero-aside-label {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero-aside-number {
  margin-top: 10px;
  color: var(--accent);
  font-size: clamp(3.8rem, 8vw, 6.2rem);
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
}
.hero-aside-number span { font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; font-size: 1.4rem; letter-spacing: 0; }
.hero-aside p { margin: 8px 0 22px; color: var(--text-soft); }
.hero-aside-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 0.8rem; }

.stats-row {
  grid-template-columns: 1.3fr 1fr 1fr 1fr;
  gap: 0;
  margin: 0 0 78px;
  border-bottom: 1px solid var(--border);
}
.stat-card {
  min-height: 128px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 20px;
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  text-align: left;
}
.stat-card:first-child { padding-left: 0; }
.stat-card:last-child { border-right: 0; }
.stat-value { color: var(--text); font-size: 2.15rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-card:last-child .stat-value { color: var(--accent); }
.stat-label { margin-top: 9px; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.07em; text-transform: uppercase; }

.section-title { gap: 13px; margin: 0 0 24px; font-size: 1.55rem; }
.section-title .emoji { display: none; }
.section-kicker { color: var(--accent); font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; font-size: 0.7rem; letter-spacing: 0.12em; }
.section-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 78px; }
.section-card {
  min-height: 210px;
  display: flex;
  flex-direction: column;
  padding: 25px 24px 22px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--card);
  box-shadow: none;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.section-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow-lg); }
.section-card-top { align-items: flex-start; gap: 15px; margin-bottom: 18px; }
.section-card-icon {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 1.25rem;

      { type: "lead", html: "<p><strong>FastAPI</strong> — фреймворк Python для создания API. Он появился, когда разработчикам понадобились одновременно понятный код, проверка данных по типам и документация без ручной поддержки.</p>" },
      { type: "heading", text: "Откуда взялся FastAPI" },
      { type: "text", html: "<p>Проект создал Sebastián Ramírez; первая публичная версия вышла в 2018 году. FastAPI объединяет основу <strong>Starlette</strong> для веб-возможностей и <strong>Pydantic</strong> для проверки и преобразования данных. Стандарты OpenAPI и JSON Schema позволяют описывать API в машиночитаемом виде.</p>" },
      { type: "table", caption: "Части стека", head: ["Компонент", "Задача"], rows: [["FastAPI", "Маршруты, зависимости и описание API"], ["Starlette", "ASGI, запросы, ответы и middleware"], ["Pydantic", "Модели и валидация данных"], ["Uvicorn", "ASGI-сервер для запуска приложения"]] },
      { type: "code", text: "from fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"/\")\nasync def read_root():\n    return {\"message\": \"Привет, FastAPI!\"}" },
      { type: "note", tone: "tip", html: "<p>FastAPI не заменяет Python: аннотации типов, функции, исключения и асинхронность из предыдущего раздела становятся его рабочими инструментами.</p>" },
      { type: "heading", text: "Почему это стало возможным" },
      { type: "text", html: "<p>Важная предпосылка FastAPI — появление стандартных <strong>аннотаций типов</strong> в Python. Раньше типы часто существовали только в голове разработчика или в комментариях. Теперь запись <code>user_id: int</code> может одновременно помогать редактору кода, проверке типов, FastAPI и человеку, который читает API-документацию.</p><p>FastAPI опирается на открытые стандарты, а не на собственный закрытый формат. OpenAPI описывает операции HTTP API: адреса, параметры, тела запросов и ответы. JSON Schema описывает форму данных. Благодаря этому схему можно использовать в Swagger UI, генераторах клиентского кода и системах тестирования.</p>" },
      { type: "heading", text: "Ключевые этапы" },
      { type: "list", ordered: true, items: ["До FastAPI: Flask, Django и асинхронные фреймворки решали разные части задачи, но автоматическая типизированная документация обычно требовала дополнительных библиотек.", "2018 год: появляется FastAPI с идеей использовать стандартные type hints как единый источник правды для API.", "Дальше: развивается экосистема зависимостей, безопасности, WebSocket, фоновых задач и развёртывания, а FastAPI следует изменениям Python и Pydantic."] },
      { type: "text", html: "<p>Слово «быстрый» в названии означает не только скорость ответа. Для команды не менее важна скорость разработки: меньше повторений между моделью, проверкой и документацией — меньше мест, где контракт API может разойтись с кодом.</p>" },
      { type: "code", text: "# Один тип участвует сразу в нескольких задачах\n@app.get(\"/users/{user_id}\")\nasync def read_user(user_id: int):\n    # user_id уже преобразован или запрос завершится ошибкой валидации\n    return {\"id\": user_id}\n\n# GET /users/not-a-number не дойдёт до тела функции" },
      { type: "note", tone: "warning", html: "<p>Типизация не заменяет бизнес-проверки. Аннотация <code>int</code> гарантирует целое число, но не доказывает, что пользователь существует или имеет право увидеть данные. Такие правила пишут в коде приложения и зависимостях.</p>" },
      { type: "heading", text: "Место FastAPI в экосистеме" },
      { type: "text", html: "<p>FastAPI вырос не из желания заменить все фреймворки, а из сочетания нескольких зрелых идей: асинхронного серверного стандарта ASGI, типизации Python, валидации данных и открытого формата документации. Starlette предоставляет низкоуровневые веб-примитивы — маршрутизацию, middleware, WebSocket, ответы и работу с запросом. Pydantic берёт на себя преобразование данных и сообщения о несоответствии схеме. FastAPI связывает эти части в удобный интерфейс для создания API.</p><p>Такое разделение полезно понимать при отладке. Если проблема связана с HTTP-ответом, иногда нужно смотреть возможности Starlette; если модель не проходит валидацию — правила Pydantic; если неверно объявлен маршрут или зависимость — код FastAPI. Но в прикладном проекте разработчик обычно работает через единый интерфейс FastAPI.</p><p>Популярность фреймворка привела к появлению библиотек для аутентификации, работы с ORM, миграциями, очередями, наблюдаемостью и облачным развёртыванием. Они не входят в ядро автоматически. Перед подключением расширения проверяйте его совместимость с текущими версиями Python, FastAPI и Pydantic, активность поддержки и необходимость для конкретной задачи.</p>" },
      { type: "quiz", id: "q1", question: "Какая библиотека отвечает за модели и валидацию данных в FastAPI?", options: ["Pydantic", "Uvicorn", "Jinja", "SQLite"], correct: [0], multiple: false, explanation: "Pydantic использует аннотации типов для описания и проверки данных." },
      { type: "truefalse", id: "tf1", title: "Проверь понимание", statements: [{ text: "FastAPI построен поверх Starlette.", answer: true, explanation: "Starlette предоставляет FastAPI базовые ASGI-возможности." }, { text: "OpenAPI нужно писать вручную для каждого маршрута.", answer: false, explanation: "FastAPI строит OpenAPI-схему из маршрутов, типов и моделей." }, { text: "Uvicorn может запускать FastAPI-приложение.", answer: true, explanation: "Uvicorn — распространённый ASGI-сервер." }] },
      { type: "flashcards", id: "fc1", title: "Термины урока", cards: [{ front: "API", back: "Интерфейс, через который программы обмениваются данными." }, { front: "ASGI", back: "Стандарт взаимодействия асинхронного Python-веб-приложения и сервера." }, { front: "OpenAPI", back: "Стандарт описания HTTP API." }, { front: "Pydantic", back: "Библиотека моделей и валидации данных." }] }
    ]
  },

  /* ------------------------------------------------------------------ */
  "lesson-fastapi-2": {
    id: "lesson-fastapi-2",
    sectionId: "sec-fastapi-intro",
    title: "Основные особенности и преимущества",
    blocks: [
      { type: "lead", html: "<p>Главная идея FastAPI: написать обычную Python-функцию с понятными типами, а фреймворк сам разберёт HTTP-запрос, проверит данные и опишет результат в документации.</p>" },
      { type: "heading", text: "Первое приложение" },
      { type: "code", text: "# main.py\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"/items/{item_id}\")\nasync def read_item(item_id: int, q: str | None = None):\n    return {\"item_id\": item_id, \"q\": q}\n\n# В каталоге проекта:\n# uv run fastapi dev" },
      { type: "text", html: "<p>Декоратор <code>@app.get</code> связывает URL и HTTP-метод с обработчиком. Аннотация <code>item_id: int</code> подсказывает FastAPI, что параметр пути нужно преобразовать в целое число; необязательный <code>q</code> берётся из строки запроса.</p>" },
      { type: "list", ordered: false, items: ["Автоматическая валидация входных данных и понятные ошибки.", "Интерактивная документация Swagger UI по адресу /docs и ReDoc по адресу /redoc.", "Поддержка синхронных и асинхронных обработчиков.", "Подсказки типов и автодополнение в редакторе кода."] },
      { type: "note", tone: "warning", html: "<p>Высокая производительность не отменяет проектирование: медленная база данных, тяжёлые вычисления и неудачные запросы всё равно требуют отдельной оптимизации.</p>" },
      { type: "heading", text: "Разбираем запуск по шагам" },
      { type: "text", html: "<p>После установки FastAPI в проект и создания <code>main.py</code> команда <code>uv run fastapi dev</code> находит объект приложения, запускает локальный ASGI-сервер и следит за изменениями файлов. В консоли появится адрес, обычно <code>http://127.0.0.1:8000</code>, а также ссылка на <code>/docs</code>.</p><p>Режим <code>dev</code> предназначен для разработки: автоматическая перезагрузка удобна локально, но не заменяет настройки production-сервера. Для запуска приложения в развёрнутой среде в документации FastAPI используется <code>fastapi run</code>, а окружение, процессы и сетевые настройки выбирает команда проекта.</p>" },
      { type: "heading", text: "От запроса к параметру функции" },
      { type: "table", caption: "Как FastAPI читает параметры", head: ["Объявление", "Источник значения", "Пример"], rows: [["Есть в пути", "Путь URL", "item_id в /items/{item_id}"], ["Простой параметр вне пути", "Строка запроса", "q в ?q=python"], ["Pydantic-модель", "JSON-тело запроса", "product в POST /products"], ["Depends(...) ", "Результат зависимости", "проверка доступа или пагинация"]] },
      { type: "code", text: "@app.get(\"/search\")\nasync def search(q: str, page: int = 1, limit: int = 20):\n    return {\"query\": q, \"page\": page, \"limit\": limit}\n\n# /search?q=fastapi&page=2\n# q обязателен, page преобразуется в int, limit получает значение по умолчанию" },
      { type: "text", html: "<p>Аннотация возврата функции также полезна: она объясняет читателю намерение и может участвовать в проверке ответа. Когда публичный контракт сложнее простой функции, используйте отдельную модель ответа через <code>response_model</code>.</p>" },
      { type: "note", tone: "info", html: "<p>Документация появляется автоматически, но хорошие имена, короткие описания и точные типы всё равно пишет разработчик. Автогенерация усиливает ясный код, а не исправляет неясный контракт.</p>" },
      { type: "heading", text: "Преимущества и их границы" },
      { type: "text", html: "<p>Автоматическая валидация даёт клиенту предсказуемый результат: если в пути ожидалось число, а пришла строка, или модель не проходит ограничение, обработчик не запускается, а FastAPI возвращает структурированную ошибку. Это освобождает от повторяющегося ручного разбора JSON, но не отменяет проверку правил предметной области: лимита счёта, уникальности email, состояния заказа или прав пользователя.</p><p>Автодокументация особенно ценна, когда API используют несколько команд. Swagger UI позволяет отправить тестовый запрос из браузера, ReDoc удобен для чтения, а OpenAPI JSON могут потреблять генераторы клиента. Однако документация будет полезна только при точных моделях и статусах: если маршрут принимает неописанный словарь и всегда возвращает «успех», интерфейс останется неясным.</p><p>Поддержка синхронного и асинхронного кода облегчает постепенный переход. Не нужно переписывать весь проект ради одного асинхронного клиента. В то же время нельзя смешивать стили случайно: у каждой используемой библиотеки есть собственная модель работы с вводом-выводом, которую следует прочитать и протестировать.</p>" },
      { type: "quiz", id: "q1", question: "Откуда FastAPI возьмёт значение q в примере?", options: ["Из пути URL", "Из строки запроса", "Из JSON-тела", "Из файла настроек"], correct: [1], multiple: false, explanation: "Параметр q не указан в пути, поэтому FastAPI трактует его как query-параметр." },
      { type: "codefill", id: "cf1", title: "Восстанови маршрут", code: "@app.___(\"/health\")\nasync def health():\n    return {\"status\": \"ok\"}", options: ["get", "post", "route"], correct: [0], explanation: "Для GET-маршрута используется декоратор app.get()." },
      { type: "memory", id: "mem1", title: "Возможность — результат", pairs: [{ a: "/docs", b: "Интерактивная Swagger UI" }, { a: "type hints", b: "Проверка и описание данных" }, { a: "@app.get", b: "GET-маршрут" }, { a: "fastapi dev", b: "Сервер разработки с перезагрузкой" }] }
    ]
  },

  /* ------------------------------------------------------------------ */
  "lesson-fastapi-3": {
    id: "lesson-fastapi-3",
    sectionId: "sec-fastapi-intro",
    title: "Архитектура FastAPI",
    blocks: [
      { type: "lead", html: "<p>В небольшом приложении маршруты можно хранить в одном файле. Когда сервис растёт, FastAPI помогает разделить API на модули, а общую логику — на зависимости.</p>" },
      { type: "heading", text: "Путь запроса" },
      { type: "text", html: "<p>ASGI-сервер принимает HTTP-запрос и передаёт его приложению. FastAPI выбирает маршрут, извлекает параметры, валидирует их, вызывает зависимости и обработчик, затем сериализует ответ. Middleware может обработать запрос до и после обработчика.</p>" },
      { type: "code", text: "from fastapi import APIRouter, FastAPI\n\nrouter = APIRouter(prefix=\"/users\", tags=[\"users\"])\n\n@router.get(\"/\")\nasync def list_users():\n    return [{\"name\": \"Анна\"}]\n\napp = FastAPI()\napp.include_router(router)" },
      { type: "heading", text: "Зависимости" },
      { type: "code", text: "from fastapi import Depends\n\ndef pagination(skip: int = 0, limit: int = 20):\n    return {\"skip\": skip, \"limit\": limit}\n\n@app.get(\"/items\")\nasync def list_items(page: dict = Depends(pagination)):\n    return page" },
      { type: "note", tone: "tip", html: "<p>Зависимость — не «магия». Это функция, результат которой FastAPI вычисляет и передаёт обработчику. Так удобно переиспользовать проверку прав, пагинацию и подключение к ресурсам.</p>" },
      { type: "heading", text: "Слои приложения" },
      { type: "table", caption: "Типичная структура растущего сервиса", head: ["Слой", "Ответственность"], rows: [["router", "HTTP-путь, параметры и код статуса"], ["schema", "Pydantic-модели входа и выхода"], ["service", "Бизнес-правила приложения"], ["repository", "Доступ к базе данных или внешнему API"], ["dependency", "Повторно используемая инфраструктура и проверки"]] },
      { type: "text", html: "<p>FastAPI не навязывает единственную файловую структуру. Для учебного или маленького приложения допустим один файл. Когда повторяются доменные понятия и маршруты, разделение по модулям делает код проще: обработчик остаётся тонким, а бизнес-правило можно вызвать из теста без HTTP.</p>" },
      { type: "heading", text: "Ошибки и ответы" },
      { type: "code", text: "from fastapi import HTTPException\n\n@app.get(\"/orders/{order_id}\")\nasync def get_order(order_id: int):\n    order = await service.get(order_id)\n    if order is None:\n        raise HTTPException(status_code=404, detail=\"Заказ не найден\")\n    return order" },
      { type: "text", html: "<p><code>HTTPException</code> предназначен для ожидаемых HTTP-ошибок: ресурс не найден, доступ запрещён, действие недопустимо. Не ловите все исключения одинаково: неожиданные ошибки должны быть залогированы и расследованы, а не превращены в вводящее в заблуждение сообщение клиенту.</p>" },
      { type: "heading", text: "Middleware, жизненный цикл и тесты" },
      { type: "text", html: "<p>Middleware подходит для сквозных задач: идентификатора запроса, заголовков, CORS, измерения времени и логирования. Подключение к ресурсам и их освобождение стоит организовывать через современный механизм lifespan. Маршруты можно проверять с <code>TestClient</code>, а зависимости — подменять в тестах, чтобы не обращаться к реальной базе или внешнему сервису.</p>" },
      { type: "note", tone: "warning", html: "<p>Не помещайте всю бизнес-логику в middleware или один гигантский маршрут. Тогда трудно тестировать правила, повторно использовать их и понять, где произошла ошибка.</p>" },
      { type: "heading", text: "Безопасность как часть архитектуры" },
      { type: "text", html: "<p>FastAPI предоставляет строительные блоки для схем безопасности — например, OAuth2 и bearer-токенов, — но безопасное приложение не появляется после одного импорта. Нужно определить, кто может вызвать каждый маршрут, как проверяется личность, какие действия разрешены роли и как защищаются секреты. Проверки удобно выносить в зависимости: один и тот же механизм можно применить к маршруту, группе маршрутов или целому роутеру.</p><p>Отдельно продумывают границу HTTP: ограничения размера и формы входных данных, CORS для браузерных клиентов, тайм-ауты внешних вызовов, обработку исключений, защиту от утечки внутренних деталей в сообщениях об ошибках. Логи должны содержать достаточно контекста для расследования, но не пароли, токены и персональные данные.</p><p>Архитектура становится масштабируемой не от количества папок, а от ясных границ. Роутер отвечает за транспорт, сервис — за правило, репозиторий — за хранение, а схема — за контракт. Иногда маленькому сервису достаточно двух слоёв; главное, чтобы добавление нового endpoint не требовало копировать проверку, SQL и форматирование ошибок в десять мест.</p>" },
      { type: "quiz", id: "q1", question: "Для чего нужен APIRouter?", options: ["Чтобы запускать сервер", "Чтобы группировать маршруты", "Чтобы хранить пароли", "Чтобы заменять Pydantic"], correct: [1], multiple: false, explanation: "APIRouter позволяет вынести связанные маршруты в модуль и подключить их к приложению." },
      { type: "truefalse", id: "tf1", title: "Архитектурные утверждения", statements: [{ text: "Middleware может выполнить код до и после обработчика.", answer: true, explanation: "Он оборачивает обработку HTTP-запроса." }, { text: "Все маршруты большого приложения обязательно должны быть в main.py.", answer: false, explanation: "Обычно связанные маршруты группируют с APIRouter." }, { text: "Зависимость можно применять повторно в нескольких маршрутах.", answer: true, explanation: "Это одна из её основных задач." }] },
      { type: "flashcards", id: "fc1", title: "Компоненты", cards: [{ front: "Маршрут", back: "Связь HTTP-метода и пути с функцией." }, { front: "APIRouter", back: "Группа маршрутов, которую можно подключить к приложению." }, { front: "Depends", back: "Объявление зависимости обработчика." }, { front: "Middleware", back: "Обработчик, оборачивающий запрос и ответ." }] }
    ]
  },

  "lesson-fastapi-4": {
    id: "lesson-fastapi-4",
    sectionId: "sec-fastapi-intro",
    title: "Сравнение с другими фреймворками",
    blocks: [
      { type: "lead", html: "<p>Фреймворк выбирают не по таблице скоростей, а по задаче, опыту команды и окружению. FastAPI особенно удобен для API, где важны типы, схемы данных и асинхронный ввод-вывод.</p>" },
      { type: "table", caption: "Упрощённое сравнение", head: ["Инструмент", "Сильная сторона", "Когда уместен"], rows: [["FastAPI", "Типы, OpenAPI, async", "Новые API и сервисы"], ["Flask", "Минимализм и гибкость", "Небольшие приложения и прототипы"], ["Django", "Полный веб-стек и ORM", "Сайты с административной частью"], ["Starlette", "Лёгкий ASGI-фундамент", "Когда нужен очень тонкий слой"]] },
      { type: "heading", text: "Не путайте задачу и инструмент" },
      { type: "text", html: "<p>Django не «хуже» FastAPI: его встроенные компоненты полезны для многих веб-приложений. Flask не требует аннотаций типов, но их можно применять самостоятельно. FastAPI добавляет автоматическое использование типов для HTTP API — это снижает объём шаблонного кода.</p>" },
      { type: "code", text: "# FastAPI: тип параметра сразу участвует в валидации\n@app.get(\"/products/{product_id}\")\nasync def get_product(product_id: int):\n    return {\"id\": product_id}" },
      { type: "note", tone: "warning", html: "<p>Не переносите результаты синтетических бенчмарков на свой проект без измерений. Реальная задержка часто определяется базой данных, сетью и внешними сервисами.</p>" },
      { type: "heading", text: "Критерии выбора" },
      { type: "list", ordered: false, items: ["Тип продукта: нужен только API, полноценный сайт с шаблонами или административная часть?", "Компетенции команды: какие инструменты она уже умеет поддерживать?", "Экосистема: база данных, аутентификация, фоновые задачи, мониторинг и развёртывание.", "Требования к контракту: нужны ли готовая OpenAPI-схема, строгие модели и SDK для клиентов?", "Эксплуатация: измеренные нагрузки, надёжность, стоимость и наблюдаемость."] },
      { type: "text", html: "<p>Flask даёт минимальный HTTP-слой: к нему можно выбрать почти любые расширения, но проект сам определяет больше соглашений. Django включает зрелый набор для веб-приложений: ORM, миграции, формы, шаблоны и админ-панель. Starlette — более низкоуровневая ASGI-основа. FastAPI добавляет поверх неё ориентированный на типы опыт разработки API.</p>" },
      { type: "heading", text: "Асинхронность — не единственный параметр" },
      { type: "text", html: "<p>FastAPI и Starlette хорошо работают с асинхронным I/O. Но если большая часть времени уходит на синхронную библиотеку, вычисления или базу данных, поддержка <code>async</code> сама по себе не обеспечит выигрыш. Измеряйте узкие места в условиях, близких к вашему сервису.</p>" },
      { type: "code", text: "# Django или Flask тоже могут отдавать JSON API.\n# Отличие FastAPI — компактная связь маршрута, типов и OpenAPI:\n@app.get(\"/reports/{report_id}\", response_model=ReportOut)\nasync def get_report(report_id: int):\n    return await reports.get(report_id)" },
      { type: "note", tone: "tip", html: "<p>Выбирайте не «самый современный» фреймворк, а наименьшую подходящую систему. Сильная сторона FastAPI проявляется, когда команда действительно использует модели, тесты и контракт API.</p>" },
      { type: "heading", text: "Сравнивайте проект, а не названия" },
      { type: "text", html: "<p>У фреймворков разные стартовые точки. Django полезен, когда приложению нужна насыщенная серверная часть: модели данных, миграции, пользователи, формы, шаблоны и административный интерфейс. Flask хорош, если команде нужен небольшой и свободно собираемый HTTP-слой. FastAPI сокращает путь к типизированному API. На одном продукте эти инструменты даже могут сосуществовать, если есть понятная граница ответственности.</p><p>Сравнение производительности корректно только при одинаковой задаче: размере ответов, сериализации, базе данных, числе соединений, middleware и инфраструктуре. Результат простого benchmark не обещает скорость настоящей системы. Быстрее всего обычно оказывается не тот сервис, где выбран модный стек, а тот, где измерены запросы к базе, настроены индексы, тайм-ауты, кэширование и ограничение ресурсов.</p><p>Кривая обучения тоже имеет цену. FastAPI требует уверенного владения Python-типами, Pydantic-моделями и HTTP-семантикой. Это вложение окупается на API с несколькими потребителями, но для одноразовой задачи не всегда необходимо. Решение лучше фиксировать коротким архитектурным обоснованием, а не личным предпочтением.</p>" },
      { type: "quiz", id: "q1", question: "Что точнее всего описывает FastAPI?", options: ["Единственный выбор для Python", "Фреймворк для API с типами и автоматической документацией", "ORM для баз данных", "Замена ASGI-сервера"], correct: [1], multiple: false, explanation: "FastAPI — веб-фреймворк, ориентированный на создание API." },
      { type: "codefill", id: "cf1", title: "Типизированный параметр", code: "async def get_product(product_id: ___):\n    return {\"id\": product_id}", options: ["int", "dict", "FastAPI"], correct: [0], explanation: "Аннотация int описывает ожидаемый тип параметра пути." },
      { type: "memory", id: "mem1", title: "Инструмент — характерная черта", pairs: [{ a: "FastAPI", b: "OpenAPI из типов" }, { a: "Flask", b: "Минималистичный старт" }, { a: "Django", b: "Полный веб-стек" }, { a: "Uvicorn", b: "ASGI-сервер" }] }
    ]
  },

  "lesson-fastapi-5": {
    id: "lesson-fastapi-5",
    sectionId: "sec-fastapi-intro",
    title: "Сферы применения FastAPI",
    blocks: [
      { type: "lead", html: "<p>FastAPI подходит там, где один сервис должен надёжно принимать и выдавать структурированные данные по HTTP: от внутреннего API команды до сервиса, который обслуживает мобильное приложение.</p>" },
      { type: "heading", text: "Типичные задачи" },
      { type: "list", ordered: false, items: ["Backend для браузерного или мобильного клиента.", "Микросервис с чётким API-контрактом.", "API для модели машинного обучения или аналитического процесса.", "Интеграционный сервис между внешними системами.", "Внутренний инструмент с документацией для коллег."] },
      { type: "code", text: "from pydantic import BaseModel\n\nclass PredictionRequest(BaseModel):\n    text: str\n\n@app.post(\"/predict\")\nasync def predict(data: PredictionRequest):\n    label = \"positive\" if \"хорошо\" in data.text.lower() else \"neutral\"\n    return {\"label\": label}" },
      { type: "text", html: "<p>В примере модель входных данных делает контракт <code>POST /predict</code> видимым в коде и документации. Однако настоящую модель машинного обучения нельзя бездумно запускать прямо в обработчике: для тяжёлых вычислений нужны очередь задач, отдельный воркер или другой подход к масштабированию.</p>" },
      { type: "note", tone: "tip", html: "<p>Начинайте с маленького API-контракта: один ресурс, несколько операций, понятные статусы и тестируемые сценарии. Масштабировать маленький ясный сервис проще.</p>" },
      { type: "heading", text: "Отрасли и продукты" },
      { type: "table", caption: "Примеры задач", head: ["Сценарий", "Что даёт FastAPI", "На что обратить внимание"], rows: [["Мобильный backend", "Понятные JSON-контракты и документация", "Версии API и авторизация"], ["Внутренняя интеграция", "Модели и проверка данных между системами", "Повторы запросов и аудит"], ["ML-сервис", "Приём структурированных данных и выдача результата", "Время инференса и очередь задач"], ["IoT/реальное время", "ASGI и WebSocket при необходимости", "Подключения и ограничения ресурсов"]] },
      { type: "text", html: "<p>REST API — распространённый сценарий, но не единственный. FastAPI поддерживает WebSocket, загрузку файлов, streaming-ответы и фоновые задачи. Выбирайте эти возможности, исходя из протокола и нагрузки: фоновая задача после ответа подходит для небольшого действия, а длительная критичная обработка обычно требует надёжной очереди и отдельного воркера.</p>" },
      { type: "heading", text: "Небольшой контракт важнее большого набора эндпоинтов" },
      { type: "code", text: "class TicketIn(BaseModel):\n    subject: str\n    priority: int = Field(ge=1, le=5)\n\n@app.post(\"/tickets\", status_code=201)\nasync def create_ticket(ticket: TicketIn):\n    created = await tickets.create(ticket)\n    return created" },
      { type: "text", html: "<p>Такой маршрут уже задаёт полезный контракт: какие поля принимает сервис, какие значения допустимы и какой статус вернётся после создания. Для рабочего продукта нужно также определить модель ответа, обработку конфликтов, аутентификацию, хранение и наблюдаемость.</p>" },
      { type: "note", tone: "warning", html: "<p>Не путайте автодокументацию с безопасностью. Для публичного API обязательны продуманная аутентификация, авторизация, ограничение запросов, проверка входных данных и безопасное хранение секретов.</p>" },
      { type: "heading", text: "Практические сценарии подробнее" },
      { type: "text", html: "<p>В e-commerce API обычно управляет каталогом, корзиной, заказами и платежными интеграциями. Здесь полезны модели запроса, понятные статусы конфликтов и идемпотентность: повторный запрос клиента не должен случайно создать второй платёж. В аналитике или машинном обучении сервис может принять набор признаков и вернуть результат. В таком случае отдельно оценивают размер полезной нагрузки, время обработки, версию модели и конфиденциальность данных.</p><p>Во внутренних системах FastAPI часто служит адаптером: забирает данные из одного формата, проверяет их и передаёт другой системе. Автоматическая OpenAPI-схема облегчает подключение соседней команды, но интеграция всё равно требует договорённостей о версиях, повторных доставках, ошибках и владельце данных.</p><p>Микросервисная архитектура не является обязательным следствием выбора FastAPI. Один хорошо структурированный сервис или модульный монолит часто проще для старта. Отделяйте сервисы только когда есть независимое развёртывание, масштабирование, владение или технологическая граница; сетевое взаимодействие добавляет задержки, сбои и сложность наблюдения.</p>" },
      { type: "quiz", id: "q1", question: "Какой сценарий особенно хорошо подходит FastAPI?", options: ["Редактирование фотографий в браузере", "Типизированный HTTP API для мобильного приложения", "Замена операционной системы", "Только статическая HTML-страница"], correct: [1], multiple: false, explanation: "FastAPI предназначен для серверных HTTP API с данными и контрактами." },
      { type: "truefalse", id: "tf1", title: "Применение на практике", statements: [{ text: "FastAPI можно использовать для внутреннего API компании.", answer: true, explanation: "Автодокументация особенно полезна внутренним потребителям API." }, { text: "FastAPI автоматически решает проблему тяжёлых вычислений.", answer: false, explanation: "Архитектуру фоновых и CPU-bound задач нужно проектировать отдельно." }, { text: "Pydantic-модель помогает описать контракт запроса.", answer: true, explanation: "Её поля входят в проверку и OpenAPI-схему." }] },
      { type: "flashcards", id: "fc1", title: "Сценарии", cards: [{ front: "Микросервис", back: "Небольшой самостоятельный сервис с API-контрактом." }, { front: "ML API", back: "HTTP-слой для передачи данных модели и результата." }, { front: "Интеграция", back: "Связь нескольких систем через API." }, { front: "Контракт", back: "Согласованное описание запросов и ответов." }] }
    ]
  },

  "lesson-fastapi-6": {
    id: "lesson-fastapi-6",
    sectionId: "sec-fastapi-intro",
    title: "Асинхронное программирование",
    blocks: [
      { type: "lead", html: "<p>Асинхронность помогает серверу не простаивать во время ожидания сети, файлов или базы данных. Это не означает автоматического ускорения любого кода и не равно параллельному выполнению на нескольких ядрах.</p>" },
      { type: "heading", text: "Когда писать async def" },
      { type: "text", html: "<p>Используйте <code>async def</code>, если внутри вызываете библиотеку с <code>await</code>. Если библиотека синхронная и блокирующая, обработчик можно объявить обычным <code>def</code>: FastAPI выполнит его в отдельном потоке. В одном приложении допустимо сочетать оба стиля.</p>" },
      { type: "code", text: "import asyncio\n\n@app.get(\"/wait\")\nasync def wait_one_second():\n    await asyncio.sleep(1)\n    return {\"status\": \"done\"}\n\n@app.get(\"/legacy\")\ndef legacy_query():\n    result = blocking_library.query()\n    return result" },
      { type: "note", tone: "warning", html: "<p>Нельзя убрать блокировку, просто поставив <code>async</code> перед функцией. Вызов синхронной долгой операции внутри <code>async def</code> всё ещё блокирует поток обработки.</p>" },
      { type: "heading", text: "Конкурентность и параллелизм" },
      { type: "text", html: "<p>Конкурентность переключается между ожидающими задачами; она особенно полезна для I/O. Параллелизм выполняет работу одновременно на нескольких ядрах или процессах; он нужен для тяжёлых CPU-задач.</p>" },
      { type: "heading", text: "Что делает event loop" },
      { type: "text", html: "<p>Асинхронная функция возвращает корутину. Когда она доходит до <code>await</code> операции ввода-вывода, цикл событий может временно переключиться на другую готовую задачу. Это позволяет одному процессу эффективно обслуживать много ожидающих сетевых запросов без создания потока на каждое ожидание.</p><p>Важно различать <strong>конкурентность</strong> и <strong>параллелизм</strong>. Конкурентность организует множество задач, которые по очереди продвигаются; параллелизм одновременно выполняет вычисления на нескольких ядрах. Асинхронность особенно полезна в первом случае — когда работа часто ждёт сеть или диск.</p>" },
      { type: "heading", text: "Асинхронный внешний запрос" },
      { type: "code", text: "import httpx\n\n@app.get(\"/weather/{city}\")\nasync def weather(city: str):\n    async with httpx.AsyncClient() as client:\n        response = await client.get(\"https://example.test/weather\", params={\"city\": city})\n    response.raise_for_status()\n    return response.json()" },
      { type: "text", html: "<p>Здесь <code>httpx.AsyncClient</code> и его метод <code>get</code> асинхронны, поэтому <code>await</code> уместен. В настоящем приложении клиент часто создают и закрывают в жизненном цикле приложения, задают тайм-ауты и обрабатывают ошибки внешнего сервиса. Нельзя считать сеть надёжной только потому, что вызов асинхронный.</p>" },
      { type: "heading", text: "Чего async def не делает" },
      { type: "list", ordered: false, items: ["Не ускоряет CPU-bound вычисление: обработка большого изображения или обучение модели всё равно занимает процессор.", "Не делает синхронную библиотеку неблокирующей: её вызов внутри async def может задержать обработку других запросов.", "Не отменяет ограничения соединений, тайм-ауты, повторы и контроль ошибок.", "Не требует объявлять все функции приложения асинхронными: FastAPI поддерживает обычные def-обработчики."] },
      { type: "code", text: "# Для синхронного драйвера или библиотеки допустим обычный def\n@app.get(\"/legacy-report\")\ndef legacy_report():\n    return old_reporting_library.build()\n\n# Для тяжёлой работы используйте отдельный процесс или очередь задач,\n# а не бесконечное вычисление в обработчике." },
      { type: "note", tone: "tip", html: "<p>Практическое правило: сначала выясните, как работает конкретная библиотека. Если её вызов требует <code>await</code>, используйте <code>async def</code>; если она блокирующая и синхронная — обычный <code>def</code> часто честнее и безопаснее.</p>" },
      { type: "heading", text: "Параллельное ожидание задач" },
      { type: "text", html: "<p>Иногда обработчику действительно нужно получить несколько независимых сетевых результатов. Если операции не зависят друг от друга, их можно запускать конкурентно с помощью <code>asyncio.gather()</code>. Но это не лицензия на неограниченный параллелизм: сотни одновременных запросов к внешнему API могут превысить лимит, исчерпать соединения или сделать ошибку сложной для диагностики.</p><p>Любой внешний вызов должен иметь тайм-аут. Для ненадёжных операций также определяют, допустимы ли повтор, отмена, частичный результат и кэш. Эти решения зависят от семантики: повтор чтения каталога может быть безопасен, а повтор оплаты — нет без идемпотентного ключа.</p>" },
      { type: "code", text: "import asyncio\n\nasync def load_dashboard(client):\n    users, orders = await asyncio.gather(\n        client.get(\"https://example.test/users\"),\n        client.get(\"https://example.test/orders\"),\n    )\n    return {\"users\": users.json(), \"orders\": orders.json()}" },
      { type: "heading", text: "Проектируйте для отмены и сбоев" },
      { type: "text", html: "<p>Клиент может закрыть соединение, внешний сервис — ответить медленно или ошибкой, а процесс — перезапуститься. Асинхронный код должен корректно освобождать ресурсы через контекстные менеджеры и не скрывать исключения. Ошибка одного параллельного запроса может отменить всю группу; если нужен частичный результат, это надо продумать и явно отразить в контракте.</p><p>Профилирование остаётся обязательным. Если endpoint медленный, измерьте, сколько занимают сериализация, запрос к БД, сеть и собственно вычисление. После этого выбирают: асинхронный драйвер, пул соединений, кэш, отдельный worker или изменение запроса. «Добавить async» до измерения — не стратегия оптимизации.</p>" },
      { type: "quiz", id: "q1", question: "Когда уместно async def?", options: ["Когда внутри нужно await-ить асинхронный вызов", "Всегда без исключений", "Только для POST", "Только для кода без сети"], correct: [0], multiple: false, explanation: "async def нужен для await-совместимых операций; синхронные обработчики тоже поддерживаются." },
      { type: "codefill", id: "cf1", title: "Ожидание операции", code: "async def load():\n    result = ___ client.get(\"https://example.test\")\n    return result", options: ["await", "yield", "return"], correct: [0], explanation: "Асинхронный вызов ожидают через await внутри async def." },
      { type: "memory", id: "mem1", title: "Понятие — смысл", pairs: [{ a: "async def", b: "Функция, где доступен await" }, { a: "await", b: "Ожидание асинхронной операции" }, { a: "I/O", b: "Ввод-вывод: сеть, файлы, БД" }, { a: "CPU-bound", b: "Задача, ограниченная вычислениями" }] }
    ]
  },
