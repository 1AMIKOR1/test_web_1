      {
        type: "code",
        lang: "python",
        text: "# app/users/service.py\nfrom datetime import datetime, timedelta, timezone\nimport hmac\n\nfrom jose import JWTError, jwt\nfrom passlib.context import CryptContext\nfrom passlib.exc import UnknownHashError\nfrom sqlalchemy.exc import IntegrityError\n\nfrom app.config import settings\nfrom app.exceptions import AuthenticationError, ConflictError, NotFoundError\nfrom app.service import BaseService\nfrom app.users.schemas import (\n    Role,\n    TokenResponse,\n    UserCreate,\n    UserLogin,\n    UserRead,\n    UserRegister,\n    UserRepositoryCreate,\n    UserRepositoryPatch,\n    UserRepositorySchema,\n    UserRoleUpdate,\n    UserUpdate,\n    role_flags,\n    role_from_flags,\n)\n\n\nclass UsersService(BaseService):\n    pwd_context = CryptContext(schemes=[\"bcrypt\"], deprecated=\"auto\")\n    login_error = \"Неверный логин или пароль\"\n\n    def create_access_token(self, data: dict | int) -> str:\n        to_encode = {\"sub\": str(data)} if isinstance(data, int) else data.copy()\n        to_encode[\"exp\"] = datetime.now(timezone.utc) + timedelta(days=30)\n        return jwt.encode(\n            to_encode,\n            settings.SECRET_KEY,\n            algorithm=settings.ALGORITHM,\n        )\n\n    def decode_token(self, token: str) -> dict:\n        try:\n            payload = jwt.decode(\n                token,\n                settings.SECRET_KEY,\n                algorithms=[settings.ALGORITHM],\n            )\n        except JWTError as ex:\n            raise AuthenticationError(\"Неверный токен\") from ex\n\n        if not payload.get(\"exp\") or not payload.get(\"sub\"):\n            raise AuthenticationError(\"Неверный токен\")\n        try:\n            if int(payload[\"sub\"]) <= 0:\n                raise ValueError\n        except (TypeError, ValueError) as ex:\n            raise AuthenticationError(\"Неверный токен\") from ex\n        return payload\n\n    def hash_password(self, password: str) -> str:\n        return self.pwd_context.hash(password)\n\n    def verify_password(self, plain_password: str, stored_password: str) -> bool:\n        if self._is_bcrypt(stored_password):\n            try:\n                return self.pwd_context.verify(plain_password, stored_password)\n            except (TypeError, ValueError, UnknownHashError):\n                return False\n        return hmac.compare_digest(plain_password, stored_password)\n\n    def _is_bcrypt(self, stored_password: str) -> bool:\n        try:\n            return self.pwd_context.identify(stored_password) == \"bcrypt\"\n        except (TypeError, ValueError):\n            return False\n\n    @staticmethod\n    def to_public(user: UserRepositorySchema) -> UserRead:\n        return UserRead.model_validate(user, from_attributes=True)\n\n    @staticmethod\n    def redirect_path(user: UserRepositorySchema) -> str:\n        return {\n            Role.intern: \"/pages/intern\",\n            Role.waiter: \"/pages/waiter\",\n            Role.chef: \"/pages/chef\",\n            Role.super_admin: \"/pages/admin\",\n        }[role_from_flags(user)]\n\n    async def _ensure_unique(self, values: dict, exclude_id: int | None = None):\n        for field in (\"email\", \"phone\"):\n            value = values.get(field)\n            if value is None:\n                continue\n            user = await self.db.users.get_one_or_none(**{field: value})\n            if user is not None and user.id != exclude_id:\n                raise ConflictError(\n                    \"Пользователь с таким email или телефоном уже существует\"\n                )\n\n    async def _create(self, data: UserRegister | UserCreate, role: Role):\n        values = data.model_dump()\n        await self._ensure_unique(values)\n        write_data = UserRepositoryCreate(\n            email=data.email,\n            password=self.hash_password(data.password),\n            name=data.name,\n            last_name=data.last_name,\n            phone=data.phone,\n            **role_flags(role),\n        )\n        try:\n            user = await self.db.users.add(write_data)\n            await self.db.commit()\n        except IntegrityError as ex:\n            await self.db.rollback()\n            raise ConflictError(\n                \"Пользователь с таким email или телефоном уже существует\"\n            ) from ex\n        return self.to_public(user)\n\n    async def register_user(self, data: UserRegister) -> UserRead:\n        return await self._create(data, Role.intern)\n\n    async def create_user(self, data: UserCreate) -> UserRead:\n        return await self._create(data, data.role)\n\n    async def login_user(self, data: UserLogin) -> TokenResponse:\n        user = await self.db.users.get_user_with_hashed_password(data.email)\n        if user is None or not self.verify_password(data.password, user.password):\n            raise AuthenticationError(self.login_error)\n\n        if not self._is_bcrypt(user.password):\n            await self.db.users.edit(\n                UserRepositoryPatch(password=self.hash_password(data.password)),\n                exclude_unset=True,\n                id=user.id,\n            )\n            await self.db.commit()\n\n        token = self.create_access_token({\"sub\": str(user.id)})\n        return TokenResponse(\n            access_token=token,\n            redirect_to=self.redirect_path(user),\n        )\n\n    async def get_current_user(self, user_id: int) -> UserRepositorySchema:\n        user = await self.db.users.get_one_or_none(id=user_id)\n        if user is None:\n            raise AuthenticationError(\"Неверный токен\")\n        return user\n\n    async def get_users(self) -> list[UserRead]:\n        users = await self.db.users.get_all()\n        return [self.to_public(user) for user in users]\n\n    async def update_user(self, user_id: int, data: UserUpdate) -> UserRead:\n        if await self.db.users.get_one_or_none(id=user_id) is None:\n            raise NotFoundError(\"Пользователь не найден\")\n\n        values = {\n            key: value\n            for key, value in data.model_dump(exclude_unset=True).items()\n            if value is not None\n        }\n        await self._ensure_unique(values, exclude_id=user_id)\n        if \"password\" in values:\n            values[\"password\"] = self.hash_password(values[\"password\"])\n\n        try:\n            user = await self.db.users.edit(\n                UserRepositoryPatch(**values),\n                exclude_unset=True,\n                id=user_id,\n            )\n            await self.db.commit()\n        except IntegrityError as ex:\n            await self.db.rollback()\n            raise ConflictError(\n                \"Пользователь с таким email или телефоном уже существует\"\n            ) from ex\n        return self.to_public(user)\n\n    async def change_role(self, user_id: int, data: UserRoleUpdate) -> UserRead:\n        if await self.db.users.get_one_or_none(id=user_id) is None:\n            raise NotFoundError(\"Пользователь не найден\")\n        user = await self.db.users.edit(\n            UserRepositoryPatch(**role_flags(data.role)),\n            exclude_unset=True,\n            id=user_id,\n        )\n        await self.db.commit()\n        return self.to_public(user)\n\n    async def delete_user(self, user_id: int, current_user_id: int) -> None:\n        if await self.db.users.get_one_or_none(id=user_id) is None:\n            raise NotFoundError(\"Пользователь не найден\")\n        if user_id == current_user_id:\n            raise ConflictError(\"Нельзя удалить свою учетную запись\")\n        if await self.db.users.has_orders(user_id) or await self.db.users.has_shifts(\n            user_id\n        ):\n            raise ConflictError(\"Нельзя удалить пользователя с заказами или сменами\")\n        if not await self.db.users.delete(id=user_id):\n            raise NotFoundError(\"Пользователь не найден\")\n        await self.db.commit()"
      },

      }

        text: "# app/orders/service.py\nfrom datetime import date, datetime, time, timedelta\n\nfrom app.exceptions import AuthorizationError, ConflictError, NotFoundError\nfrom app.orders.repository import OrderRepositoryCreate\nfrom app.orders.schemas import SOrderAdd, SOrderFilter, SOrderGet, SOrderStatusUpdate, Status\nfrom app.service import BaseService\nfrom app.users.schemas import Role, role_from_flags\n\n\nclass OrdersService(BaseService):\n    async def get_orders(self, filters: SOrderFilter, current_user) -> list[SOrderGet]:\n        role = role_from_flags(current_user)\n        if filters.user_id is not None and role != Role.super_admin:\n            raise AuthorizationError(\"Фильтр по пользователю доступен только администратору\")\n\n        user_id = filters.user_id\n        statuses = filters.status\n        if role == Role.waiter:\n            user_id = current_user.id\n        elif role == Role.chef:\n            allowed = (Status.create, Status.cook)\n            if statuses is not None and not set(statuses) <= set(allowed):\n                raise AuthorizationError(\"Повару доступны только заказы кухни\")\n            statuses = statuses or list(allowed)\n        elif role != Role.super_admin:\n            raise AuthorizationError()\n\n        date_from = date_to = None\n        if filters.created_on is not None:\n            date_from = datetime.combine(filters.created_on, time.min)\n            date_to = date_from + timedelta(days=1)\n\n        return await self.db.orders.get_filtered(\n            statuses=None if statuses is None else [status.value for status in statuses],\n            user_id=user_id,\n            date_from=date_from,\n            date_to=date_to,\n        )\n\n    async def create_order(self, data: SOrderAdd, waiter) -> SOrderGet:\n        shift = await self.db.shifts.get_by_user_and_date(waiter.id, date.today())\n        if shift is None:\n            raise ConflictError(\"Смена официанта не начата\")\n\n        order = aw /* Переключение светлой/тёмной темы. Настройка хранится в localStorage. */

window.Theme = (function () {
  var KEY = "textbook:theme";
  var root = document.documentElement;

  function current() {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) return saved;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function apply(theme) {
    root.dataset.theme = theme;
    try { localStorage.setItem(KEY, theme); } catch (e) {}
    var btn = document.getElementById("theme-toggle");
    if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
  }

  function toggle() {
    apply(current() === "dark" ? "light" : "dark");
  }

  return { current: current, apply: apply, toggle: toggle };
})();
</script>
  <script>
/* Хранилище прогресса. У каждой книги свой ключ localStorage.
   Структура:
     {
       completedLessons: { "lesson-1": true, ... },
       activities: { "lesson-1:q1": { score, total, passed, attempts, updatedAt }, ... }
     } */

window.Store = (function () {
  var bookId = window.CURRICULUM && window.CURRICULUM.id ? window.CURRICULUM.id : "default";
  var KEY = "textbook:" + bookId + ":v1";
  var state = load();
  var listeners = [];

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function notify() {
    for (var i = 0; i < listeners.length; i++) listeners[i](state);
  }

  try {
    state.completedLessons = state.completedLessons || {};
    state.activities = state.activities || {};
  } catch (e) {}

  return {
    getState: function () { return state; },

    isLessonCompleted: function (lessonId) {
      return !!state.completedLessons[lessonId];
    },

    setLessonCompleted: function (lessonId, completed) {
      if (completed) state.completedLessons[lessonId] = true;
      else delete state.completedLessons[lessonId];
      persist();
      notify();
    },

    getActivityResult: function (key) {
      return state.activities[key] || null;
    },

    saveActivityResult: function (key, result) {
      var prev = state.activities[key];
      result.attempts = (prev ? prev.attempts : 0) + 1;
      result.updatedAt = Date.now();
      state.activities[key] = result;
      persist();
      notify();
    },

    resetAll: function () {
      state = { completedLessons: {}, activities: {} };
      persist();
      notify();
    },

    subscribe: function (fn) {
      listeners.push(fn);
      fn(state);
      return fn;
    }
  };
})();

</script>
  <script>
/* Статистика: вычисляет прогресс из контента (curriculum + lessons) и Store. */

window.Stats = (function () {
  var curriculum = window.CURRICULUM || { sections: [] };
  var lessons = window.LESSONS || {};

  function activityTypes() {
    return window.GameRegistry ? Object.keys(window.GameRegistry.list()) : [];
  }

  function topicType(type) {
    var types = activityTypes();
    for (var i = 0; i < types.length; i++) {
      if (type === types[i]) return true;
    }
    return false;
  }

  function isEnabled(item) {
    return !item || item.enabled !== false;
  }

  function visibleSections() {
    return curriculum.sections.filter(isEnabled);
  }

  function visibleTopics(section) {
    if (!isEnabled(section)) return [];
    return (section.topics || []).filter(function (topic) {
      return isEnabled(topic) && (!topic.lessonId || (lessons[topic.lessonId] && isEnabled(lessons[topic.lessonId])));
    });
  }

  function sectionTitle(section) {
    var sections = visibleSections();
    var index = sections.indexOf(section);
    var title = (section.title || "").replace(/^\s*Раздел\s+\d+\.\s*/i, "");
    return "Раздел " + (index + 1) + ". " + title;
  }

  function allLessons() {
    var list = [];
    visibleSections().forEach(function (section) {
      visibleTopics(section).forEach(function (topic) {
        if (topic.lessonId && lessons[topic.lessonId]) {
          list.push(lessons[topic.lessonId]);
        }
      });
    });
    return list;
  }

  function lessonActivities(lesson) {
    return (lesson.blocks || []).filter(function (b) {
      return topicType(b.type);
    });
  }

  function activityKey(lessonId, blockId) {
    return lessonId + ":" + blockId;
  }

  /* Прогресс урока: количество пройденных активностей из общего числа. */
  function lessonProgress(lessonId) {
    var lesson = lessons[lessonId];
    if (!lesson) return { passed: 0, total: 0 };
    var acts = lessonActivities(lesson);
    var passed = 0;
    for (var i = 0; i < acts.length; i++) {
      var r = Store.getActivityResult(activityKey(lessonId, acts[i].id));
      if (r && r.passed) passed++;
    }
    return { passed: passed, total: acts.length };
  }

  function lessonStatus(lessonId) {
    if (Store.isLessonCompleted(lessonId)) return "done";
    var p = lessonProgress(lessonId);
    return p.passed > 0 ? "progress" : "new";
  }

  /* Прогресс раздела — сумма по урокам его тем. */
  function sectionProgress(section) {
    var passed = 0, total = 0;
    visibleTopics(section).forEach(function (topic) {
      if (topic.lessonId && lessons[topic.lessonId]) {
        var p = lessonProgress(topic.lessonId);
        passed += p.passed;
        total += p.total;
      }
    });
    return { passed: passed, total: total };
  }

  function overall() {
    var list = allLessons();
    var completedLessons = 0, passedActivities = 0, totalActivities = 0;
    list.forEach(function (lesson) {
      if (Store.isLessonCompleted(lesson.id)) completedLessons++;
      var p = lessonProgress(lesson.id);
      passedActivities += p.passed;
      totalActivities += p.total;
    });
    var pct = totalActivities === 0 ? 0 : Math.round((passedActivities / totalActivities) * 100);
    return {
      totalLessons: list.length,
      completedLessons: completedLessons,
      passedActivities: passedActivities,
      totalActivities: totalActivities,
      sections: visibleSections().length,
      percent: pct
    };
  }

  function firstLessonId() {
    var list = allLessons();
    return list.length ? list[0].id : null;
  }

  function sectionById(id) {
    var sections = visibleSections();
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].id === id) return sections[i];
    }
    return null;
  }

  function getLesson(id) {
    var lesson = lessons[id];
    if (!lesson || !isEnabled(lesson)) return null;
    var sections = visibleSections();
    for (var i = 0; i < sections.length; i++) {
      var topics = visibleTopics(sections[i]);
      for (var j = 0; j < topics.length; j++) {
        if (topics[j].lessonId === id) return lesson;
      }
    }
    return null;
  }

  function activityTypeLabel(type) {
    var labels = {
      quiz: "Тест",
      truefalse: "Правда или ложь",
      flashcards: "Карточки",
      memory: "Найди пару",
      codefill: "Восстанови код"
    };
    return labels[type] || type;
  }

  return {
    allLessons: allLessons,
    visibleSections: visibleSections,
    visibleTopics: visibleTopics,
    sectionTitle: sectionTitle,
    lessonActivities: lessonActivities,
    lessonProgress: lessonProgress,
    lessonStatus: lessonStatus,
    sectionProgress: sectionProgress,
    overall: overall,
    firstLessonId: firstLessonId,
    sectionById: sectionById,
    getLesson: getLesson,
    activityTypeLabel: activityTypeLabel
  };
})();

</script>

    });

    var root = document.getElementById("toast-root");
    if (!root) return;
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    root.appendChild(el);

      el.classList.add("out");

  var RE_JS = makeRe(JS_KW, JS_BI, "\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\/");

    code = String(code == null ? "" : code);
    var mode = String(lang || "").toLowerCase();
    var re = mode === "js" || mode === "javascript" ? RE_JS : RE_PY;
    var html = "";
    var last = 0;
    var m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null) {
      if (m.index > last) html += esc(code.slice(last, m.index));
      var cls = "";
      if (m[1]) cls = "tok-str";
      else if (m[2]) cls = "tok-cmt";
      else if (m[3]) cls = "tok-num";
      else if (m[4]) cls = "tok-dec";
      else if (m[5]) cls = "tok-kw";
      else if (m[6]) cls = "tok-bi";
      else if (m[7]) cls = "tok-fn";
      html += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
      last = m.index + m[0].length;
      if (m[0].length === 0) break;
    }
    if (last < code.length) html += esc(code.slice(last));
    return html;
  }

  window.Syntax = { highlight: highlight };

  <script>
/* Общие помощники для интерактивных блоков (тестов и игр). */

window.GameHelpers = (function () {
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  /* Очищает контейнер и создаёт обёртку активности с шапкой. Возвращает корень. */
  function wrap(container, block, label, icon) {
    container.innerHTML = "";
    var shell = el("div", "activity activity-" + (block.type || "block") + " block");
    var head = el("div", "activity-head");
    head.appendChild(el("span", "activity-icon", icon));
    head.appendChild(el("h3", null, block.title || label));
    var chip = el("span", "badge badge-soft");
    chip.textContent = label;
    head.appendChild(chip);
    shell.appendChild(head);
    container.appendChild(shell);
    return shell;
  }

  /* Результат активности в store. */
  function key(ctx, blockId) {
    return ctx.lessonId + ":" + blockId;
  }

  function saved(ctx, blockId) {
    return Store.getActivityResult(key(ctx, blockId));
  }

  function saveResult(ctx, blockId, result) {
    Store.saveActivityResult(key(ctx, blockId), result);
  }

  /* Лента с результатом: passed/failed/warn. */
  function banner(text, kind) {
    var elNode = el("div", "result-banner " + (kind === "ok" ? "passed" : kind === "warn" ? "warn" : "failed"));
    elNode.textContent = text;
    return elNode;
  }

  return {
    esc: esc,
    shuffle: shuffle,
    el: el,
    wrap: wrap,
    saved: saved,
    saveResult: saveResult,
    banner: banner
  };
})();
</script>
  <script>
/* Реестр интерактивных блоков.

   Новый тип игры добавляется так:
   1. Создайте файл js/games/yourGame.js с функцией render(container, block, ctx).
   2. В конце вызовите GameRegistry.register("your-type", render).
   3. Подключите файл в index.html (перед views/lesson.js).
   Платформа сама вызовет ваш рендер, когда встретит блок с type "your-type". */

window.GameRegistry = (function () {
  var renderers = {};

  function register(type, renderer) {
    renderers[type] = renderer;
  }

  function render(type, container, block, ctx) {
    var fn = renderers[type];
    if (!fn) {
      container.innerHTML = "";
      var shell = document.createElement("div");
      shell.className = "activity block";
      shell.appendChild(GameHelpers.banner("Блок типа «" + type + "» ещё не реализован — добавьте его в js/games/.", "warn"));
      container.appendChild(shell);
      return;
    }
    fn(container, block, ctx);
  }

  function list() {
    return renderers;
  }

  return { register: register, render: render, list: list };
})();

(function () {

  function render(container, block, ctx) {
    var shell = H.wrap(container, block, "Правда или ложь", "✅");
    var prev = H.saved(ctx, block.id);
    if (prev && prev.passed) {
      shell.appendChild(H.banner("Задание уже выполнено (" + prev.score + "/" + prev.total + ").", "ok"));
    }

    var body = H.el("div", "tf-body");
    var statements = block.statements || [];
    var total = statements.length;
    var answered = 0;
    var correctCount = 0;

    statements.forEach(function (st, index) {
      var wrapEl = H.el("div", "tf-statement");
      wrapEl.appendChild(H.el("p", "tf-text", st.text));

      var actions = H.el("div", "tf-actions");
      var btnTrue = H.el("button", "tf-btn", "Истина");
      var btnFalse = H.el("button", "tf-btn", "Ложь");
      btnTrue.type = btnFalse.type = "button";

      function answer(value) {
        answered++;
        var isRight = st.answer === value;
        if (isRight) correctCount++;

        [btnTrue, btnFalse].forEach(function (b) {
          b.disabled = true;
          b.classList.remove("chosen");

        var chosen = value ? btnTrue : btnFalse;

        if (st.explanation) {

        }

        var passed = answered === total && correctCount === total;
        H.saveResult(ctx, block.id, {
          score: correctCount,
          total: total,
          passed: passed
        });

        if (answered === total) {
          if (passed) {
            shell.appendChild(H.banner("Верно всё: " + correctCount + " из " + total + ".", "ok"));

      cells.push({ key: i, text: p.a });
      cells.push({ key: i, text: p.b });
    });
    cells = H.shuffle(cells);

    var openIndex = -1;
    var matched = new Set();
    var busy = false;

    var statsRow = H.el("div", "memory-stats");

        H.saveResult(ctx, block.id, { score: pairs.length, total: pairs.length, passed: true, moves: moves });

  <script>
/* Страница урока: рендер блоков, окончание урока, навигация предыдущий/следующий. */

window.Views = window.Views || {};
var _lessonCleanup = null;

window.Views.cleanupLesson = function () {
  if (_lessonCleanup) {
    _lessonCleanup();
    _lessonCleanup = null;
  }
};

function protectLessonCode(root) {
  var lastTargetWasCode = false;

  function isCode(node) {
    while (node && node !== root) {
      if (node.classList && (node.classList.contains("block-code") || node.classList.contains("cf-code")) &&
          !node.classList.contains("code-copyable")) {
        return true;
      }
      node = node.parentNode;
    }
    return false;
  }

  function selectionHasCode() {
    var selection = window.getSelection();
    var range;
    var blocks;
    var i;
    if (!selection || !selection.rangeCount) return false;
    range = selection.getRangeAt(0);
    blocks = root.querySelectorAll(".block-code:not(.code-copyable), .cf-code:not(.code-copyable)");
    for (i = 0; i < blocks.length; i++) {
      if (range.intersectsNode(blocks[i])) return true;
    }
    return false;
  }

  function stopClipboard(event) {
    if (!selectionHasCode() && !lastTargetWasCode) return;
    event.preventDefault();
    Layout.toast("Код нужно набрать вручную");
  }

  function stopShortcut(event) {
    if (!lastTargetWasCode || (!event.ctrlKey && !event.metaKey) || (event.key !== "c" && event.key !== "x")) return;
    event.preventDefault();
    Layout.toast("Код нужно набрать вручную");
  }

  function rememberTarget(event) {
    lastTargetWasCode = isCode(event.target);
  }

  function stopPointerAction(event) {
    if (isCode(event.target)) event.preventDefault();
  }

  document.addEventListener("copy", stopClipboard, true);
  document.addEventListener("cut", stopClipboard, true);
  document.addEventListener("keydown", stopShortcut, true);
  document.addEventListener("pointerdown", rememberTarget, true);
  root.addEventListener("contextmenu", stopPointerAction);
  root.addEventListener("dragstart", stopPointerAction);

  return function () {
    document.removeEventListener("copy", stopClipboard, true);
    document.removeEventListener("cut", stopClipboard, true);
    document.removeEventListener("keydown", stopShortcut, true);
    document.removeEventListener("pointerdown", rememberTarget, true);
    root.removeEventListener("contextmenu", stopPointerAction);
    root.removeEventListener("dragstart", stopPointerAction);
  };
}

window.Views.lesson = function (app, lessonId) {
  window.Views.cleanupLesson();
  var lesson = Stats.getLesson(lessonId);
  var bookTitle = (window.CURRICULUM && window.CURRICULUM.title) || "Учебник";
  var root = document.createElement("div");
  root.className = "lesson-view";

  if (!lesson) {
    root.innerHTML =
      "<div class='page-head'><h1>Урок не найден</h1>" +
      "<p>Возможно, этот урок ещё не добавлен или ссылка устарела.</p></div>" +
      "<div><a class='btn btn-primary' href='#/contents'>К содержанию</a></div>";
    app.appendChild(root);
    return { title: "Урок не найден — " + bookTitle };
  }

  var section = Stats.sectionById(lesson.sectionId || "");
  var topicNumber = 0;
  if (section) {
    Stats.visibleTopics(section).forEach(function (topic, index) {
      if (topic.lessonId === lesson.id) topicNumber = index + 1;
    });
  }

  var crumbs = document.createElement("nav");
  crumbs.className = "crumbs";
  crumbs.setAttribute("aria-label", "Хлебные крошки");
  crumbs.innerHTML =
    "<a href='#/'>Главная</a><span>→</span>" +
    "<a href='#/contents'>Содержание</a><span>→</span>" +
    "<span class='crumb-current'>" + GameHelpers.esc(lesson.title) + "</span>";
  root.appendChild(crumbs);

  var head = document.createElement("div");
  head.className = "lesson-head";
  head.innerHTML =
    (section ? "<span class='badge badge-accent'>" + GameHelpers.esc(section.icon + " " + Stats.sectionTitle(section) + " · Урок " + topicNumber) + "</span>" : "") +
    "<h1>" + GameHelpers.esc(lesson.title) + "</h1>" +
    "<div class='badges'><span class='badge badge-soft'>📄 " + Stats.lessonActivities(lesson).length + " заданий</span></div>";
  root.appendChild(head);

  var blocksWrap = document.createElement("div");
  blocksWrap.className = "blocks";

  (lesson.blocks || []).forEach(function (block, index) {
    var wrapEl = document.createElement("div");
    wrapEl.className = "fade-in fade-in-delay-" + Math.min(index % 3, 2);

    switch (block.type) {
      case "heading":
        wrapEl.innerHTML = "<h2 class='block block-heading'>" + GameHelpers.esc(block.text) + "</h2>";
        break;

      case "lead":
        wrapEl.innerHTML = "<div class='block block-lead'>" + block.html + "</div>";
        break;

      case "text":
        wrapEl.innerHTML = "<div class='block block-text'>" + block.html + "</div>";
        break;

      case "list": {
        var list = document.createElement(block.ordered ? "ol" : "ul");
        list.className = "block block-list" + (block.ordered ? " ordered" : "");
        (block.items || []).forEach(function (item) {
          var li = document.createElement("li");
          li.textContent = item;
          list.appendChild(li);
        });
        wrapEl.appendChild(list);
        break;
      }

      case "quote":
        wrapEl.innerHTML =
          "<blockquote class='block block-quote'><p>" + GameHelpers.esc(block.text) + "</p>" +
          (block.author ? "<footer>— " + GameHelpers.esc(block.author) + "</footer>" : "") + "</blockquote>";
        break;

      case "note": {
        var tones = { info: "ℹ️", tip: "💡", warning: "⚠️" };
        var icons = { info: "ℹ️", tip: "💡", warning: "⚠️" };
        var tone = tones[block.tone] ? block.tone : "info";
        wrapEl.innerHTML =
          "<aside class='block note note-" + tone + "'><span class='note-icon'>" + icons[tone] + "</span>" +
          "<div>" + block.html + "</div></aside>";
        break;
      }

      case "code": {
        var pre = document.createElement("pre");
        pre.className = "block block-code" + (block.copyable ? " code-copyable" : "");
        var codeEl = document.createElement("code");
        if (window.Syntax) {
          codeEl.innerHTML = window.Syntax.highlight(block.text, block.lang);
        } else {
          codeEl.textContent = block.text;
        }
        pre.appendChild(codeEl);
        wrapEl.appendChild(pre);
        break;
      }

      case "table": {
        var tableWrap = document.createElement("div");
        tableWrap.className = "block-table-wrap";
        var table = document.createElement("table");
        table.className = "block-table";
        if (block.caption) {
          var cap = document.createElement("caption");
          cap.textContent = block.caption;
          table.appendChild(cap);
        }
        var thead = document.createElement("thead");
        var headRow = document.createElement("tr");
        (block.head || []).forEach(function (h) {
          var th = document.createElement("th");
          th.textContent = h;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);
        var tbody = document.createElement("tbody");
        (block.rows || []).forEach(function (row) {
          var tr = document.createElement("tr");
          row.forEach(function (cell) {
            var td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        wrapEl.appendChild(tableWrap);
        break;
      }

      default: {
        /* Интерактивные блоки через реестр игр. */
        if (window.GameRegistry && GameRegistry.list()[block.type]) {
          var box = document.createElement("div");
          wrapEl.appendChild(box);
          GameRegistry.render(block.type, box, block, { lessonId: lesson.id });
        } else {
          wrapEl.innerHTML =
            "<div class='block'>" + GameHelpers.banner("Неизвестный тип блока: " + GameHelpers.esc(block.type), "warn").outerHTML + "</div>";
        }
      }
    }

    blocksWrap.appendChild(wrapEl);
  });

  root.appendChild(blocksWrap);

  /* --- Окончание урока --- */
  var endWrap = document.createElement("section");
  endWrap.className = "lesson-end";

  var sentinel = document.createElement("div");
  sentinel.className = "end-sentinel";

  var endCard = document.createElement("div");
  endCard.className = "lesson-end-card";
  endCard.innerHTML =
    "<div class='lesson-end-icon'>🎉</div>" +
    "<h2>Урок завершён!</h2>" +
    "<p>Вы дочитали урок до конца. Если выполнили все задания — урок засчитан как пройденный.</p>" +
    "<div class='progress-wrap'><div class='mini'><span>Задания</span><span data-acts></span></div>" +
    "<div class='progress-track'><span class='progress-fill' data-fill></span></div></div>";
  endWrap.appendChild(sentinel);
  endWrap.appendChild(endCard);

  /* Навигация по урокам в порядке содержания. */
  var nav = document.createElement("div");
  nav.className = "lesson-nav";
  var all = Stats.allLessons();
  var idx = -1;
  for (var i = 0; i < all.length; i++) {
    if (all[i].id === lesson.id) idx = i;
  }
  if (idx > 0) {
    var prevLink = document.createElement("a");
    prevLink.className = "btn btn-ghost";
    prevLink.href = "#/lesson/" + all[idx - 1].id;
    prevLink.innerHTML = "← " + GameHelpers.esc(all[idx - 1].title);
    prevLink.title = "Предыдущий урок";
    nav.appendChild(prevLink);
  }
  var tocLink = document.createElement("a");
  tocLink.className = "btn btn-soft";
  tocLink.href = "#/contents";
  tocLink.textContent = "К содержанию";
  nav.appendChild(tocLink);
  if (idx !== -1 && idx < all.length - 1) {
    var nextLink = document.createElement("a");
    nextLink.className = "btn btn-primary";
    nextLink.href = "#/lesson/" + all[idx + 1].id;
    nextLink.innerHTML = GameHelpers.esc(all[idx + 1].title) + " →";
    nextLink.title = "Следующий урок";
    nav.appendChild(nextLink);
  }
  endWrap.appendChild(nav);
  root.appendChild(endWrap);

  app.appendChild(root);
  var stopCodeProtection = protectLessonCode(root);

  /* Прогресс по заданиям урока в карточке завершения. */
  function paintEndProgress() {
    var p = Stats.lessonProgress(lesson.id);
    var acts = endCard.querySelector("[data-acts]");
    var fill = endCard.querySelector("[data-fill]");
    if (acts) acts.textContent = p.passed + " / " + p.total;
    if (fill) fill.style.width = (p.total === 0 ? 0 : Math.round(p.passed / p.total * 100)) + "%";
  }
  paintEndProgress();
  var stopProgress = Store.subscribe(function () { paintEndProgress(); });
  _lessonCleanup = function () {
    stopProgress();
    stopCodeProtection();
  };

  /* Урок засчитывается, когда пользователь дошёл до конца. */
  if (typeof IntersectionObserver !== "undefined") {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting && !Store.isLessonCompleted(lesson.id)) {
          Store.setLessonCompleted(lesson.id, true);
          Layout.toast("Урок пройден! 🎉");
          observer.disconnect();
        }
      });
    }, { threshold: 0.3 });
    observer.observe(sentinel);
  } else {
    stopProgress();
    _lessonCleanup = stopCodeProtection;
  }

  return { title: lesson.title + " — " + bookTitle };
};

</script>

  <script>
/* Роутер: hash-навигация без перезагрузки страницы. */

window.Router = (function () {
  var routes = [
    { pattern: /^$/, name: "home", view: window.Views.home },
    { pattern: /^contents(?:\/([\w-]+))?$/, name: "contents", view: window.Views.contents },
    { pattern: /^lesson\/([\w-]+)$/, name: "lesson", view: window.Views.lesson }
  ];

  function parse() {
    var hash = location.hash.replace(/^#\/?/, "");
    for (var i = 0; i < routes.length; i++) {
      var m = hash.match(routes[i].pattern);
      if (m) return { name: routes[i].name, view: routes[i].view, params: m.slice(1) };
    }
    return null;
  }

  function render() {
    var app = document.getElementById("app");
    if (!app) return;
    if (window.Views.cleanupLesson) window.Views.cleanupLesson();
    app.innerHTML = "";

    var route = parse();
    var bookTitle = (window.CURRICULUM && window.CURRICULUM.title) || "Учебник";
    if (!route) {
      app.innerHTML =
        "<div class='page-head'><h1>Страница не найдена</h1>" +
        "<p>Такой страницы в учебнике нет.</p></div>" +
        "<div><a class='btn btn-primary' href='#/'>На главную</a> " +
        "<a class='btn btn-ghost' href='#/contents'>К содержанию</a></div>";
      document.title = "Страница не найдена — " + bookTitle;
      Layout.highlightNav("notfound");
    } else {
      var info = route.view(app, route.params[0]);
      document.title = (info && info.title) || bookTitle;
      Layout.highlightNav(route.name);
    }

    window.scrollTo(0, 0);
    Layout.updateProgress();
  }

  function init() {
    Layout.init();
    window.addEventListener("hashchange", render);
    render();
  }

  document.addEventListener("DOMContentLoaded", init);

  return { render: render, init: init };
})();

</script>
